                  raw: ef.raw || (ef.ing||[]).join(", "), rawFull: ef.rawFull || "",
                  sz: ef.sz == null ? null : ef.sz, u: ef.u || "g",
                  cat: catOf(ef), catTouched: true, barcode: ef.barcode || "", editing: ef.n };
        return openSheet("food", draft);
      }
      if (d.calendar) { calMonth = monthKey(sel); return openSheet("calendar"); }
      if (d.month) { calMonth = d.month; return openSheet("calendar"); }
      if (d.pick) { sel = d.pick; calMonth = null; sheet = null; view = "today"; return render(); }
      if (d.week) {
        var target = shift(sel, 7 * (+d.week));
        if (isFuture(target)) target = todayStr();
        sel = target;
        return render();
      }
      if (d.carry) {
        var cs2 = peek(sel);
        if (!cs2) return;
        var fa3 = {};
        (cs2.f || []).forEach(function (x) { fa3[x] = (cs2.fa && cs2.fa[x]) || 1; });
        state.carry = { d: shift(sel, 1), from: sel, t: (cs2.t||[]).slice(), f: (cs2.f||[]).slice(), fa: fa3,
                        m: JSON.parse(JSON.stringify(cs2.m || {})),
                        oneoff: JSON.parse(JSON.stringify(cs2.oneoff || [])) };
        save(); return render();
      }
      if (d.uncarry) { state.carry = null; save(); return render(); }
      if (d.managetags) return openSheet("tags");
      if (d.rentag) {
        var oldT = state.custom[+d.rentag];
        if (!oldT) return;
        var newT = prompt("Rename this tag:", oldT);
        if (!newT || !newT.trim()) return;
        newT = newT.trim();
        if (newT === oldT) return;
        if (state.custom.indexOf(newT) >= 0) { alert("You already have a tag called that."); return; }
        state.custom[+d.rentag] = newT;
        Object.keys(state.days).forEach(function (dd) {
          var de = state.days[dd];
          if (!de.t) return;
          var ix = de.t.indexOf(oldT);
          if (ix >= 0) de.t[ix] = newT;
        });
        (state.presets || []).forEach(function (ps) {
          if (!ps.t) return;
          var ix2 = ps.t.indexOf(oldT);
          if (ix2 >= 0) ps.t[ix2] = newT;
        });
        save(); return openSheet("tags");
      }
      if (d.deltag) {
        var delT = state.custom[+d.deltag];
        if (!delT) return;
        var n2 = 0;
        for (var dk in state.days) { var dv = state.days[dk]; if (dv.t && dv.t.indexOf(delT) >= 0) n2++; }
        if (!confirm('Delete "'+delT+'"?' + (n2 ? " It will also be removed from the "+n2+" day"+(n2===1?"":"s")+" you logged it." : ""))) return;
        state.custom.splice(+d.deltag, 1);
        Object.keys(state.days).forEach(function (dd) {
          var de2 = state.days[dd];
          if (!de2.t) return;
          var ix3 = de2.t.indexOf(delT);
          if (ix3 >= 0) de2.t.splice(ix3, 1);
        });
        (state.presets || []).forEach(function (ps2) {
          if (!ps2.t) return;
          var ix4 = ps2.t.indexOf(delT);
          if (ix4 >= 0) ps2.t.splice(ix4, 1);
        });
        save(); return openSheet("tags");
      }
      if (d.presets) return openSheet("presets");
      if (d.copyprev) {
        var src = peek(shift(sel, -1));
        if (!src) return;
        var tgt = entry(sel);
        (src.t || []).forEach(function (x) { if (tgt.t.indexOf(x) < 0) tgt.t.push(x); });
        (src.f || []).forEach(function (x) {
          if (tgt.f.indexOf(x) < 0) tgt.f.push(x);
          if (tgt.fa[x] == null) tgt.fa[x] = (src.fa && src.fa[x]) || 1;
        });
        if (src.m) { tgt.m = tgt.m || {}; for (var mk in src.m) if (tgt.m[mk] == null) tgt.m[mk] = src.m[mk]; }
        (src.oneoff || []).forEach(function (f) {
          if (tgt.f.indexOf(f.n) < 0) return;
          var dup = false;
          (tgt.oneoff = tgt.oneoff || []).forEach(function (x) { if (x.n === f.n) dup = true; });
          if (!dup) tgt.oneoff.push(JSON.parse(JSON.stringify(f)));
        });
        save(); return render();
      }
      if (d.savepreset) {
        var cur = peek(sel);
        if (!cur || ((!cur.t || !cur.t.length) && (!cur.f || !cur.f.length))) {
          alert("Nothing selected on this day to save."); return;
        }
        var nm3 = prompt("Name this preset — e.g. usual weekday");
        if (!nm3 || !nm3.trim()) return;
        var fa2 = {};
        (cur.f || []).forEach(function (x) { fa2[x] = (cur.fa && cur.fa[x]) || 1; });
        state.presets.push({ n: nm3.trim(), t: (cur.t||[]).slice(), f: (cur.f||[]).slice(), fa: fa2,
                             m: JSON.parse(JSON.stringify(cur.m || {})),
                             oneoff: JSON.parse(JSON.stringify(cur.oneoff || [])) });
        sheet = null; save(); return render();
      }
      if (d.applypreset) {
        var ps2 = state.presets[+d.applypreset];
        if (!ps2) return;
        var tg = entry(sel);
        (ps2.t || []).forEach(function (x) { if (tg.t.indexOf(x) < 0) tg.t.push(x); });
        (ps2.f || []).forEach(function (x) {
          if (tg.f.indexOf(x) < 0) tg.f.push(x);
          if (tg.fa[x] == null) tg.fa[x] = (ps2.fa && ps2.fa[x]) || 1;
        });
        if (ps2.m) { tg.m = tg.m || {}; for (var pk in ps2.m) if (tg.m[pk] == null) tg.m[pk] = ps2.m[pk]; }
        (ps2.oneoff || []).forEach(function (f) {
          var dup = false;
          (tg.oneoff = tg.oneoff || []).forEach(function (x) { if (x.n === f.n) dup = true; });
          if (!dup) tg.oneoff.push(JSON.parse(JSON.stringify(f)));
        });
        sheet = null; save(); return render();
      }
      if (d.delpreset) {
        var pd = state.presets[+d.delpreset];
        if (pd && confirm('Delete the preset "'+pd.n+'"?')) { state.presets.splice(+d.delpreset,1); save(); render(); }
        return;
      }
      if (d.resetday) {
        if (!confirm("Clear everything logged on "+longDate(sel)+"? This can't be undone.")) return;
        delete state.days[sel];
        if (state.carry && state.carry.from === sel) state.carry = null;
        save(); return render();
      }
      if (d.once != null) { grabDraft(); draft.once = (d.once === "1"); return openSheet("food", draft); }
      if (d.lookup) { grabDraft(); return lookupBarcode(draft.barcode); }
      if (d.bcscan) return scanBarcode();
      if (d.recount) { grabDraft(); rebuildDraft(); return openSheet("food", draft); }
      if (d.docrop) return runCrop(false);
      if (d.cropall) return runCrop(true);
      if (d.usefull) {
        draft.raw = draft.rawFull || draft.raw;
        draft.foundSection = false;
        rebuildDraft();
        return openSheet("food", draft);
      }
      if (d.cam) return pickImage(true);
      if (d.lib) return pickImage(false);
      if (d.parse) {
        grabDraft();
        rebuildDraft();
        return openSheet("food", draft);
      }
      if (d.flag) {
        grabDraft();
        var i0 = draft.flags.indexOf(d.flag);
        if (i0>=0) draft.flags.splice(i0,1); else draft.flags.push(d.flag);
        return openSheet("food", draft);
      }
      if (d.savefood) {
        grabDraft();
        var name = (draft.name||"").trim();
        if (!name) { var el = document.getElementById("fname"); el && el.focus(); return; }
        if (!draft.ingredients.length && draft.raw) draft.ingredients = parseIngredients(draft.raw).parts;
        var payload = { ing: draft.ingredients, fl: draft.flags, items: draft.items || [],
                        sz: draft.sz, u: draft.u || "g", raw: draft.raw, rawFull: draft.rawFull || "",
                        cat: (draft.catTouched && draft.cat) ? draft.cat : guessCat(draft.flags, draft.u),
                        barcode: draft.barcode || "" };

        // one-off: keep it on this day only, never in the saved library
        if (draft.once && !draft.editing) {
          var eo = entry(sel);
          if (foodByName(name) && !isOneOff(name)) { alert("You already have a saved food called that. Give this one a different name."); return; }
          payload.n = name;
          var already = -1;
          eo.oneoff.forEach(function (f, ix) { if (f.n === name) already = ix; });
          if (already >= 0) eo.oneoff[already] = payload; else eo.oneoff.push(payload);
          if (eo.f.indexOf(name) < 0) { eo.f.push(name); eo.fa[name] = 1; }
          sheet = null; save(); return render();
        }

        // editing a one-off updates it in place on its day
        if (draft.editingOnce) {
          var eo2 = entry(sel);
          for (var oi = 0; oi < eo2.oneoff.length; oi++) {
            if (eo2.oneoff[oi].n === draft.editingOnce) {
              var oldN = eo2.oneoff[oi].n;
              payload.n = name;
              eo2.oneoff[oi] = payload;
              if (oldN !== name) {
                var fx = eo2.f.indexOf(oldN);
                if (fx >= 0) eo2.f[fx] = name;
                if (eo2.fa[oldN] != null) { eo2.fa[name] = eo2.fa[oldN]; delete eo2.fa[oldN]; }
                if (eo2.m && eo2.m[oldN] != null) { eo2.m[name] = eo2.m[oldN]; delete eo2.m[oldN]; }
              }
              break;
            }
          }
          sheet = null; save(); return render();
        }
        var wasEditing = draft.editing;
        var target = wasEditing ? foodByName(wasEditing) : foodByName(name);
        if (target) {
          var oldName = target.n;
          target.n = name;
          for (var kk in payload) target[kk] = payload[kk];
          if (oldName !== name) {
            // carry the rename through every day that logged it
            Object.keys(state.days).forEach(function (dd) {
              var de = state.days[dd];
              if (!de.f) return;
              var ix = de.f.indexOf(oldName);
              if (ix >= 0) {
                de.f[ix] = name;
                if (de.fa && de.fa[oldName] != null) { de.fa[name] = de.fa[oldName]; delete de.fa[oldName]; }
              }
            });
          }
        } else {
          payload.n = name;
          state.foods.push(payload);
        }
        if (!wasEditing) {
          var e0 = entry(sel);
          if (e0.f.indexOf(name)<0) { e0.f.push(name); e0.fa[name] = 1; }
        }
        sheet = null; save(); return render();
      }
      if (d.retire) {
        var f = state.foods[+d.retire];
        if (!f) return;
        var n5 = useCount(f.n);
        if (confirm('Retire "'+f.n+'"?\n\nIt disappears from the Today screen but stays in your '
            + (n5 ? n5+' logged day'+(n5===1?'':'s') : 'history')
            + ' with all its amounts intact. You can restore it any time.')) {
          f.archived = true; save(); render();
        }
        return;
      }
      if (d.restore) {
        var fr = state.foods[+d.restore];
        if (!fr) return;
        delete fr.archived; save(); return render();
      }
      if (d.purge) {
        var fp = state.foods[+d.purge];
        if (!fp) return;
        var np = useCount(fp.n);
        if (!confirm('Erase "'+fp.n+'" completely?\n\n'
            + (np ? 'It will be removed from '+np+' logged day'+(np===1?'':'s')+' and those amounts '
                    + 'will no longer count in Patterns. ' : '')
            + 'This cannot be undone.')) return;
        Object.keys(state.days).forEach(function (dk) {
          var de3 = state.days[dk];
          if (!de3.f) return;
          var ix5 = de3.f.indexOf(fp.n);
          if (ix5 >= 0) { de3.f.splice(ix5,1); delete de3.fa[fp.n]; if (de3.m) delete de3.m[fp.n]; }
        });
        (state.presets||[]).forEach(function (ps3) {
          if (!ps3.f) return;
          var ix6 = ps3.f.indexOf(fp.n);
          if (ix6 >= 0) { ps3.f.splice(ix6,1); if (ps3.fa) delete ps3.fa[fp.n]; }
        });
        state.foods.splice(+d.purge, 1);
        save(); return render();
      }
      if (d.purgeonce) {
        var parts = d.purgeonce.split("|"), dayK = parts[0], nameK = parts.slice(1).join("|");
        var de4 = state.days[dayK];
        if (!de4) return;
        if (!confirm('Erase "'+nameK+'" from '+longDate(dayK)+'? This cannot be undone.')) return;
        var ix7 = (de4.f||[]).indexOf(nameK);
        if (ix7 >= 0) { de4.f.splice(ix7,1); delete de4.fa[nameK]; if (de4.m) delete de4.m[nameK]; }
        for (var oz2 = (de4.oneoff||[]).length - 1; oz2 >= 0; oz2--) {
          if (de4.oneoff[oz2].n === nameK) de4.oneoff.splice(oz2, 1);
        }
        save(); return render();
      }
      if (d.view) { view = d.view; sheet = null; return render(); }
      if (d.day) { sel = d.day; return render(); }
      if (d.lag) { lag = +d.lag; return render(); }
      if (d.lag === "0") { lag = 0; return render(); }
      if (d.measure) { measure = d.measure; return render(); }
      if (d.mode) { mode = d.mode; return render(); }
      if (d.type) { var e1 = entry(sel);
        e1.k[d.type] = Math.max(0,(e1.k[d.type]||0)+(+d.step)); save(); return render(); }
      if (d.new) { var en = entry(sel); en.nw = Math.max(0,(en.nw||0)+(+d.new)); save(); return render(); }
      if (d.sev) { var e2 = entry(sel), v = +d.sev; e2.s = e2.s===v?null:v; save(); return render(); }
      if (d.zone) { var e6 = entry(sel), iz = e6.z.indexOf(d.zone);
        if (iz>=0) e6.z.splice(iz,1); else e6.z.push(d.zone); save(); return render(); }
      if (d.food) { var e3 = entry(sel), i1 = e3.f.indexOf(d.food);
        if (i1>=0) {
          e3.f.splice(i1,1); delete e3.fa[d.food]; setMeal(e3, d.food, null);
          for (var oz = (e3.oneoff||[]).length - 1; oz >= 0; oz--) {
            if (e3.oneoff[oz].n === d.food) e3.oneoff.splice(oz, 1);
          }
        }
        else { e3.f.push(d.food); if (!e3.fa[d.food]) e3.fa[d.food] = 1; }
        save(); return render(); }
      if (d.foodsview) { foodsView = d.foodsview; return render(); }
      if (d.pickday) { sel = d.pickday; view = "today"; return render(); }
      if (d.editonce) {
        var eod = entry(sel), src2 = null;
        eod.oneoff.forEach(function (f) { if (f.n === d.editonce) src2 = f; });
        if (!src2) return;
        draft = { name: src2.n, flags:(src2.fl||[]).slice(), ingredients:(src2.ing||[]).slice(),
                  items:(src2.items||[]).map(function(it){return {n:it.n,p:it.p,est:it.est,fl:(it.fl||[]).slice()};}),
                  raw: src2.raw||"", rawFull: src2.rawFull||"", sz: src2.sz==null?null:src2.sz,
                  u: src2.u||"g", cat: catOf(src2), catTouched:true, barcode: src2.barcode||"",
                  labelPhoto:"", dbState:"", fromDB:false, once:true, editing:null, editingOnce:src2.n };
        return openSheet("food", draft);
      }
      if (d.movefood) { mealTarget = d.movefood; return openSheet("meal"); }
      if (d.setmeal) {
        var em = entry(sel), val = d.setmeal;
        if (val === "alone") setMeal(em, mealTarget, null);
        else if (val.indexOf("with:") === 0) {
          var partner = val.slice(5), nid = nextMealId(em);
          if (!em.m) em.m = {};
          em.m[partner] = nid; em.m[mealTarget] = nid;
        } else setMeal(em, mealTarget, +val);
        mealTarget = null; sheet = null; save(); return render();
      }
      if (d.portion) {
        var e7 = entry(sel), cur = e7.fa[d.portion] || 1;
        cur = Math.round((cur + (+d.pstep)) * 10) / 10;
        if (cur < 0.5) cur = 0.5;
        e7.fa[d.portion] = cur; save(); return render();
      }
      if (d.tag) { var e4 = entry(sel), i2 = e4.t.indexOf(d.tag);
        if (i2>=0) e4.t.splice(i2,1); else e4.t.push(d.tag); save(); return render(); }
      if (d.add) {
        var nm2 = prompt("Name it — food, habit, product, anything:");
        if (nm2 && nm2.trim()) {
          nm2 = nm2.trim();
          if (state.custom.indexOf(nm2)<0) state.custom.push(nm2);
          var e5 = entry(sel); if (e5.t.indexOf(nm2)<0) e5.t.push(nm2);
          save(); render();
        }
        return;
      }
      if (d.reader) {
        var url = prompt("Paste your reader endpoint URL. Leave blank to go back to on-device reading.", state.reader || "");
        if (url === null) return;
        url = url.trim();
        if (url && !/^https:\/\//.test(url)) { alert("That needs to be an https:// URL."); return; }
        state.reader = url; save(); return render();
      }
      if (d.share) return shareBackup();
      if (d.copy) return copyOut(csv(), t, "Copy as CSV");
      if (d.backup) return copyOut(JSON.stringify(state), t, "Copy backup (JSON)");
      if (d.restore) {
        var raw = prompt("Paste a JSON backup. This replaces everything currently in the app.");
        if (!raw) return;
        try {
          var v = JSON.parse(raw);
          if (!v || typeof v !== "object" || !v.days) throw new Error("shape");
          state.days = v.days || {}; state.custom = v.custom || []; state.foods = v.foods || [];
          state.routine = v.routine || { am:"", pm:"", notes:"" };
          state.backedUp = v.backedUp || null;
          state.reader = v.reader || "";
          state.presets = v.presets || [];
          state.carry = v.carry || null;
          save(); render();
        } catch (e) { alert("That didn't look like a backup from this app. Nothing was changed."); }
        return;
      }
    };
    var n = document.getElementById("notes");
    if (n) n.oninput = function () { entry(sel).n = n.value; save(); };
    if (document.getElementById("cropc")) setupCrop();
    setupDrag();

    var cs = document.getElementById("fcat");
    if (cs) cs.onchange = function () { draft.cat = cs.value; draft.catTouched = true; };

    var q = document.getElementById("fq");
    if (q) {
      q.value = foodQuery;
      q.oninput = function () { foodQuery = q.value; filterFoods(); };
      if (foodQuery) filterFoods();
    }
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  load();
})();
</script>
</body>
</html>
