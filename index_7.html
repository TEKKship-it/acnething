<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Skin Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skin Log">
<meta name="theme-color" content="#12162A">
<style>
  :root {
    --ink: #12162A; --ink-2: #1B2140; --ink-3: #262E52; --line: #333C68;
    --paper: #ECEAF4; --paper-dim: #9AA0C4; --faint: #5B639A;
    --flare: #E4737E; --calm: #4FBFA8; --mark: #E8B84B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  body { color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 15px; line-height: 1.45; min-height: 100vh;
    padding: env(safe-area-inset-top) 0 100px; -webkit-text-size-adjust: 100%; }
  .boot { padding: 80px 20px; text-align: center; color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    letter-spacing: .08em; text-transform: uppercase; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  .strip-shell { position: sticky; top: 0; z-index: 20;
    background: linear-gradient(var(--ink) 84%, rgba(18,22,42,0)); padding: 12px 16px 16px; }
  .weekhead { display: flex; align-items: baseline; justify-content: space-between;
    margin: 0 0 8px; }
  .wmonth { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim); }
  .wcal { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--mark);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; text-decoration: underline; }
  .week { display: flex; align-items: stretch; gap: 2px; }
  .wdays { display: flex; flex: 1; gap: 2px; }
  .warr { flex: 0 0 26px; background: none; border: 0; color: var(--paper-dim);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 0; }
  .warr.off { color: var(--ink-3); }
  .day { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center;
    gap: 4px; background: none; border: 1px solid transparent; border-radius: 12px;
    padding: 6px 0 5px; cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .day.sel { background: var(--ink-2); border-color: var(--paper); }
  .day.now .dnum { color: var(--mark); }
  .day.fut { opacity: .3; }
  .bar-slot { height: 48px; width: 100%; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; }
  .seg { width: 11px; }
  .seg.dp { background: var(--flare); border-radius: 3px 3px 0 0; }
  .seg.inf { background: #C9707F; }
  .seg.co { background: #6E6FA8; border-radius: 0 0 1px 1px; }
  .seg.none { background: var(--ink-3); height: 3px; border-radius: 2px; }
  .seg.zero { background: var(--calm); height: 4px; border-radius: 2px; }
  .dow { font-size: 8.5px; color: var(--faint); }
  .dnum { font-size: 11px; color: var(--paper-dim); }
  .day.sel .dnum, .day.sel .dow { color: var(--paper); }

  .calhead { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .calm { font-family: ui-serif, "New York", Georgia, serif; font-size: 17px; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calw { text-align: center; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 8.5px; color: var(--faint); padding-bottom: 2px; }
  .calc { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--ink-2); color: var(--paper); cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; padding: 0; }
  .calc.now { outline: 1px solid var(--mark); outline-offset: 1px; }
  .calc.sel { border-width: 2px; border-color: var(--paper); }
  .calc.fut { opacity: .25; }
  .calt { font-size: 8px; color: var(--paper); opacity: .8; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
  .date { font-family: ui-serif, "New York", Georgia, serif; font-size: 26px; font-weight: 500; }
  .saved { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--calm); opacity: 0; transition: opacity .3s; }
  .saved.on { opacity: 1; }

  .total { background: var(--ink-2); border: 1px solid var(--line); border-radius: 16px 16px 0 0;
    border-bottom: 0; padding: 14px 16px 12px; display: flex; align-items: baseline; gap: 12px; }
  .cnum { font-family: ui-serif, "New York", Georgia, serif; font-size: 42px; line-height: 1;
    font-weight: 500; font-variant-numeric: tabular-nums; }
  .clab { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim); }
  .types { background: var(--ink-2); border: 1px solid var(--line); border-radius: 0 0 16px 16px;
    padding: 4px 16px 12px; margin-bottom: 22px; }
  .trow { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .tdot { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .tname { flex: 1; font-size: 13.5px; line-height: 1.25; }
  .thint { display: block; font-size: 11px; color: var(--faint); }
  .tval { font-family: ui-serif, "New York", Georgia, serif; font-size: 20px;
    font-variant-numeric: tabular-nums; min-width: 26px; text-align: center; }
  .mini { width: 38px; height: 38px; border-radius: 11px; background: var(--ink-3);
    border: 1px solid var(--line); color: var(--paper); font-size: 19px; line-height: 1; cursor: pointer; }
  .mini:active { background: var(--line); }
  .trow.newrow { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 11px; }
  .helplink { display: block; width: 100%; margin-top: 8px; padding: 8px 0; background: none;
    border: 0; color: var(--paper-dim); cursor: pointer; text-align: left;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; text-decoration: underline; }

  .sev { display: flex; gap: 6px; }
  .sevb { flex: 1; padding: 9px 0; border-radius: 11px; background: var(--ink-2);
    border: 1px solid var(--line); color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .sevb.on { background: var(--mark); border-color: var(--mark); color: #2A2208; font-weight: 600; }

  .grp { margin-bottom: 22px; }
  .grph { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--paper-dim);
    margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .grph::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .tag { padding: 9px 13px; border-radius: 999px; background: var(--ink-2);
    border: 1px solid var(--line); color: var(--paper); font-size: 13.5px; cursor: pointer; }
  .tag.on { background: var(--paper); border-color: var(--paper); color: var(--ink); }
  .tag.add { border-style: dashed; color: var(--paper-dim); }
  .tag.scan { border-color: var(--mark); color: var(--mark); }
  .tag.once { border-color: var(--calm); color: var(--calm); }
  .tag.once.on { background: var(--calm); border-color: var(--calm); color: #0A2620; }
  .tag.once.dash { border-style: dashed; }
  .xn { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; opacity: .8; }
  .oncepill { display: inline-block; margin-left: 7px; padding: 1px 5px; border-radius: 5px;
    border: 1px solid var(--calm); color: var(--calm); vertical-align: 1px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 8px;
    letter-spacing: .08em; text-transform: uppercase; }
  .pactions { display: flex; gap: 12px; }
  .grip { flex: 0 0 auto; width: 26px; height: 34px; padding: 0; margin-right: 2px;
    background: none; border: 0; color: var(--faint); cursor: grab;
    font-size: 13px; line-height: 1; letter-spacing: -3px;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  .grip:active { cursor: grabbing; color: var(--paper); }
  .prow.dragging { opacity: .35; }
  .mealcard.dropon { border-color: var(--mark); background: rgba(232,184,75,.10); }
  .mealcard.newdrop { border-style: dashed; opacity: .65; }
  .mealcard.newdrop .mealh { color: var(--faint); }
  .dragghost { position: fixed; z-index: 90; pointer-events: none;
    background: var(--ink-3); border: 1px solid var(--mark); border-radius: 10px;
    color: var(--paper); padding: 9px 12px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }

  textarea, input[type=text] { width: 100%; background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 14px; color: var(--paper); padding: 12px 14px; font: inherit; font-size: 16px; }
  textarea { min-height: 76px; resize: vertical; }
  textarea::placeholder, input::placeholder { color: var(--faint); }
  :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

  .chips { display: flex; gap: 6px; margin: 4px 0 18px; flex-wrap: wrap; }
  .chip { flex: 1 1 auto; min-width: 70px; padding: 10px 8px; border-radius: 12px;
    background: var(--ink-2); border: 1px solid var(--line); color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; cursor: pointer; }
  .chip.on { background: var(--ink-3); border-color: var(--paper); color: var(--paper); }

  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--ink-3); }
  .rowname { font-size: 14.5px; }
  .rowmeta { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    color: var(--paper-dim); letter-spacing: .04em; margin-top: 3px; line-height: 1.5; }
  .delta { font-family: ui-serif, "New York", Georgia, serif; font-size: 19px;
    font-variant-numeric: tabular-nums; text-align: right; }
  .up { color: var(--flare); } .down { color: var(--calm); }
  .kind { display: inline-block; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px;
    border-radius: 5px; border: 1px solid var(--line); color: var(--paper-dim); margin-right: 7px; }
  .kind.ing { border-color: var(--mark); color: var(--mark); }

  .trend { width: 100%; height: 190px; display: block; margin: 4px 0 2px; }
  .legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--paper-dim); }
  .key { width: 14px; height: 3px; border-radius: 2px; display: inline-block; margin-left: 8px; }
  .key:first-child { margin-left: 0; }
  .key.spots { background: var(--flare); }
  .key.ov { background: var(--calm); }
  .scaleno { margin-left: 8px; opacity: .75; }
  .trendchips .chip { min-width: 0; padding: 8px 6px; font-size: 10px; }
  .key.laser { background: var(--mark); height: 10px; width: 2px; }
  .lwrap { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin: 6px 0 8px; }
  .lcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .lbar { width: 100%; background: var(--ink-3); border-radius: 3px 3px 0 0; min-height: 2px; }
  .lbar.hot { background: var(--flare); }
  .lday { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 8px; color: var(--faint); }

  .note { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; font-size: 13px; color: var(--paper-dim); line-height: 1.5; }
  .note b { color: var(--paper); font-weight: 600; }
  .warn { background: var(--ink-2); border: 1px solid var(--flare); border-radius: 14px;
    padding: 14px; margin: 14px 0 0; }
  .warnt { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--flare); }
  .meals { margin-top: 10px; }
  .mealcard { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 8px 14px 10px; margin-bottom: 8px; }
  .mealcard.solo { border-style: dashed; }
  .mealh { display: flex; justify-content: space-between; align-items: baseline;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 9px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim);
    padding: 4px 0 2px; }
  .mealcard.solo .mealh { color: var(--faint); }
  .mealg { color: var(--mark); }
  button.pamt.del { color: var(--flare); }
  button.pamt { background: none; border: 0; padding: 2px 0 0; text-align: left; cursor: pointer;
    display: block; font-size: 11px; color: var(--faint);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; text-decoration: underline; }
  .portions { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 4px 14px 8px; margin-top: 10px; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .pname { flex: 1; font-size: 13.5px; line-height: 1.25; }
  .pamt { display: block; font-size: 11px; color: var(--faint);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .szrow { display: flex; gap: 8px; }
  .szrow input { flex: 1; }
  .szrow select { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
    color: var(--paper); padding: 12px 14px; font: inherit; font-size: 16px; min-width: 90px; }
  .quick { display: flex; gap: 7px; margin: -6px 0 16px; flex-wrap: wrap; }
  .qb.on { background: var(--mark); border-color: var(--mark); color: #2A2208; }
  .qb { padding: 8px 13px; border-radius: 999px; background: var(--ink-3);
    border: 1px solid var(--line); color: var(--paper-dim); cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; }
  .fq { margin-bottom: 12px; }
  .catrow { margin-bottom: 12px; }
  .cath { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 9px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  select.wide { width: 100%; background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 14px; color: var(--paper); padding: 12px 14px; font: inherit; font-size: 16px; }
  .hits { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .hit { display: block; width: 100%; text-align: left; padding: 11px 13px; background: var(--ink-2);
    border: 0; border-bottom: 1px solid var(--ink-3); color: var(--paper); cursor: pointer; font: inherit; }
  .hit:last-child { border-bottom: 0; }
  .hit:active { background: var(--ink-3); }
  .hitn { display: block; font-size: 14px; line-height: 1.3; }
  .hitb { display: block; font-size: 11px; color: var(--paper-dim); margin-top: 2px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .dblink { display: inline-block; margin-top: 8px; color: var(--mark); font-size: 13px; }
  .btnlink { display: block; width: 100%; margin-top: 8px; padding: 8px 0; background: none;
    border: 0; color: var(--paper-dim); cursor: pointer; text-align: left;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; text-decoration: underline; }
  .btn.danger { border-color: var(--flare); color: var(--flare); background: none; }
  .irow { display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid var(--ink-3); }
  .iname { flex: 1; font-size: 13px; line-height: 1.3; }
  .ifl { display: block; font-size: 10px; color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .ipct { display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .ipct input { width: 48px; padding: 7px 6px; border-radius: 9px; text-align: right; font-size: 15px; }
  .ipct input.est { color: var(--mark); border-color: var(--mark); }
  .ig { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    color: var(--paper); min-width: 52px; text-align: right; }
  .fbtns { display: flex; flex-direction: column; gap: 6px; }
  .tag.danger { border-color: var(--flare); color: var(--flare); }
  .tidyblock { border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px 12px;
    margin-bottom: 12px; background: var(--ink-2); }
  .tidyblock .row { border-bottom-color: var(--ink-3); }
  .tidyblock .row:last-of-type { border-bottom: 0; }
  button.tidyrow { width: 100%; text-align: left; background: none; color: var(--paper);
    font: inherit; cursor: pointer; }
  .tidyrow.picked .rowname { color: var(--mark); }
  .tidybar { position: sticky; bottom: 74px; display: flex; align-items: center; gap: 10px;
    justify-content: space-between; margin-top: 18px; padding: 12px 14px; border-radius: 14px;
    background: var(--ink-3); border: 1px solid var(--line); color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
  .tidybar.on { border-color: var(--mark); color: var(--paper); }
  .row.dim .rowname { color: var(--paper-dim); }
  .cropc { width: 100%; height: auto; display: block; border-radius: 14px;
    border: 1px solid var(--line); margin: 10px 0 4px; touch-action: none; }
  .ocr { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    color: var(--mark); min-height: 16px; margin-top: 10px; line-height: 1.5; }
  .warnb { font-size: 13px; color: var(--paper-dim); line-height: 1.5; margin: 6px 0 4px; }

  .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; gap: 4px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: rgba(18,22,42,.93); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); }
  .nav button { flex: 1; padding: 12px 0; border-radius: 13px; border: 1px solid transparent;
    background: none; color: var(--paper-dim); cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; }
  .nav button.on { background: var(--ink-3); border-color: var(--line); color: var(--paper); }

  h2.sec { font-family: ui-serif, "New York", Georgia, serif; font-size: 21px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--paper-dim); font-size: 13px; margin-bottom: 18px; }

  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(9,11,22,.82); display: flex; align-items: flex-end; }
  .sheet-in { background: var(--ink-2); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-height: 88vh;
    overflow-y: auto; max-width: 560px; margin: 0 auto; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--ink-3); color: var(--paper); font: inherit; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .btn.go { background: var(--paper); color: var(--ink); border-color: var(--paper); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* compact day view */
  .disc { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    border-radius: 14px; background: var(--ink-2); border: 1px solid var(--line); color: var(--paper);
    font: inherit; text-align: left; cursor: pointer; }
  .disct { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--paper-dim); white-space: nowrap; }
  .discv { flex: 1; font-size: 13px; color: var(--paper-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { color: var(--faint); font-size: 12px; margin-left: 6px; }
  button.mealh { width: 100%; background: none; border: 0; padding: 0; color: inherit; font: inherit;
    cursor: pointer; text-align: left; }
  .mealn { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 6px;
    background: var(--ink-3); color: var(--paper-dim); font-size: 10px; text-align: center; }
  .mealr { display: inline-flex; align-items: baseline; gap: 4px; }
  .mealsum { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    width: 100%; margin-top: 6px; padding: 0; background: none; border: 0; color: var(--paper);
    font: inherit; font-size: 13px; line-height: 1.45; text-align: left; cursor: pointer; }
  .mealsum .dot { color: var(--faint); }

  function nutGapList() {

  function gapList() {

      var b = baseName(k); use[b] = (use[b] || 0) + 1; if (!last[b] || d > last[b]) last[b] = d;
    });
    state.foods.forEach(function (f, i) {
      var g = gapKinds(f);
      if (!g.length || !use[f.n]) return;
      out.push({ f: f, ref: "lib:" + i, i: i, once: false, g: g, n: use[f.n], last: last[f.n] });
    });

    Object.keys(state.days).forEach(function (d2) {
      (state.days[d2].oneoff || []).forEach(function (o, oi) {

        out.push({ f: o, ref: "once:" + d2 + ":" + oi, d: d2, once: true, g: g, n: use[o.n] || 1, last: d2 });

  function mergeOneOffs(names, canonical) {
    if (!names.length) return;
    // prefer whichever version already has ingredient data
    var best = null;
    names.forEach(function (nm) {
      allOneOffs().forEach(function (o) {
        if (o.f.n !== nm) return;
        if (!best || ((o.f.items || []).length > (best.items || []).length)) best = o.f;
      });
    });
    if (!best) return;

    var merged = JSON.parse(JSON.stringify(best));
    merged.n = canonical;
    merged.cat = merged.cat || guessCat(merged.fl, merged.u);
    delete merged.archived;

    var existing = null;
    state.foods.forEach(function (f) { if (f.n === canonical) existing = f; });
    if (existing) { for (var k in merged) if (k !== "n") existing[k] = merged[k]; }
    else state.foods.push(merged);

    // rewrite every day: rename the entries, drop the one-off definitions
    Object.keys(state.days).forEach(function (d) {
      var e = state.days[d];
      if (!e.f) return;
      var portion = null, mealId = null, touchedDay = false;
      names.forEach(function (nm) {
        slotsFor(e, nm).forEach(function (k) {
          var ix = e.f.indexOf(k);
          if (ix < 0) return;
          touchedDay = true;
          if (portion == null) portion = (e.fa && e.fa[k]) || 1;
          if (mealId == null && e.m && e.m[k] != null) mealId = e.m[k];
          e.f.splice(ix, 1);
          if (e.fa) delete e.fa[k];
          if (e.m) delete e.m[k];
        });
      });
      if (!touchedDay) return;
      if (e.f.indexOf(canonical) < 0) e.f.push(canonical);
      e.fa = e.fa || {};
      if (e.fa[canonical] == null) e.fa[canonical] = portion == null ? 1 : portion;
      if (mealId != null) { e.m = e.m || {}; e.m[canonical] = mealId; }
      for (var oi = (e.oneoff || []).length - 1; oi >= 0; oi--) {
        if (names.indexOf(e.oneoff[oi].n) >= 0) e.oneoff.splice(oi, 1);
      }
      if (e.m) {
        var counts = {};
        for (var mk in e.m) counts[e.m[mk]] = (counts[e.m[mk]] || 0) + 1;
        for (var mk2 in e.m) if (counts[e.m[mk2]] < 2) delete e.m[mk2];
      }
    });
    tidySel = {};
    save();
  }

    return '<div class="note" style="border-color:var(--flare);margin:0 0 14px">'

  function hasBarcodeScanner() { return typeof BarcodeDetector !== "undefined"; }

  function scanBarcode() {
    var inp = document.getElementById("bcshot");
    if (!inp) return;
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      grabDraft();
      ocrStatus("Reading the barcode\u2026");
      prepImage(f, function (canvas) {
        if (!canvas) return ocrStatus("That image didn't load.");
        try {
          var det = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128"] });
          det.detect(canvas).then(function (codes) {
            if (!codes || !codes.length) return ocrStatus("No barcode found. Fill the frame with it, or type the digits.");
            lookupBarcode(codes[0].rawValue);
          }).catch(function () { ocrStatus("Couldn't read that barcode. Type the digits instead."); });
        } catch (e) { ocrStatus("Couldn't read that barcode. Type the digits instead."); }
      });
    };
    inp.click();
  }

  function grabDraft() {
    var n = document.getElementById("fname"), g = document.getElementById("fing"),
        z = document.getElementById("fsz"), u = document.getElementById("fu");
    if (n) draft.name = n.value;
    if (g) draft.raw = g.value;
    if (z) draft.sz = z.value ? parseFloat(String(z.value).replace(",", ".")) : null;
    if (u) draft.u = u.value;
    var bc = document.getElementById("fbc");
    if (bc) draft.barcode = bc.value.replace(/\D/g, "");
    if (document.getElementById("nut_kcal")) {

  function sharpen(src, box) {

    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    if (ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);

    try {
      var d = ctx.getImageData(0, 0, w, h), p = d.data, n = w * h;
      var gray = new Float64Array(n), i, j;
      for (i = 0, j = 0; j < n; i += 4, j++) gray[j] = p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114;

      // integral image for O(1) window means
      var iw = w + 1, integ = new Float64Array(iw * (h + 1));
      for (var y = 0; y < h; y++) {
        var rs = 0;
        for (var x = 0; x < w; x++) {
          rs += gray[y*w + x];
          integ[(y+1)*iw + (x+1)] = integ[y*iw + (x+1)] + rs;

      for (var yy = 0; yy < h; yy++) {

        for (var xx = 0; xx < w; xx++) {
          var x1 = xx - rad < 0 ? 0 : xx - rad, x2 = xx + rad > w-1 ? w-1 : xx + rad;
          var area = (x2-x1+1) * (y2-y1+1);
          var sum = integ[(y2+1)*iw + (x2+1)] - integ[y1*iw + (x2+1)]
                  - integ[(y2+1)*iw + x1] + integ[y1*iw + x1];
          var v = gray[yy*w + xx] < (sum/area) - C ? 0 : 255;
          var k = (yy*w + xx) * 4;

  // Drag a food by its grip onto another meal card. Pointer events cover touch and mouse;
  // touch-action is disabled on the grip only, so the rest of the page still scrolls.
  function setupDrag() {
    var grips = document.querySelectorAll("[data-grip]");
    if (!grips.length) return;

    for (var i = 0; i < grips.length; i++) bindGrip(grips[i]);

    function bindGrip(grip) {
      grip.addEventListener("pointerdown", function (ev) {
        if (ev.button != null && ev.button !== 0) return;
        ev.preventDefault();
        ev.stopPropagation();

        var name = grip.getAttribute("data-grip");
        var row = grip.closest(".prow");
        var startX = ev.clientX, startY = ev.clientY;
        var moved = false, ghost = null, lastTarget = null;

        try { grip.setPointerCapture(ev.pointerId); } catch (e) {}

        function makeGhost() {
          var r = row.getBoundingClientRect();
          ghost = document.createElement("div");
          ghost.className = "dragghost";
          ghost.textContent = name;
          ghost.style.width = r.width + "px";
          document.body.appendChild(ghost);
          row.classList.add("dragging");
        }

        function place(x, y) {
          if (!ghost) return;
          ghost.style.left = (x - 40) + "px";
          ghost.style.top = (y - 22) + "px";
        }

        function targetAt(x, y) {
          if (ghost) ghost.style.display = "none";
          var el = document.elementFromPoint(x, y);
          if (ghost) ghost.style.display = "";
          if (!el) return null;
          var card = el.closest ? el.closest("[data-drop]") : null;
          return card;
        }

        function onMove(e2) {
          var dx = e2.clientX - startX, dy = e2.clientY - startY;
          if (!moved && Math.sqrt(dx*dx + dy*dy) < 6) return;
          if (!moved) { moved = true; makeGhost(); }
          e2.preventDefault();
          place(e2.clientX, e2.clientY);

          var card = targetAt(e2.clientX, e2.clientY);
          if (card !== lastTarget) {
            if (lastTarget) lastTarget.classList.remove("dropon");
            lastTarget = card;
            if (card && card.getAttribute("data-drop") !== ownGroupId(name)) card.classList.add("dropon");
          }

          // nudge the page when dragging near an edge
          if (window.scrollBy) {
            var vh = window.innerHeight;
            if (e2.clientY < 90) window.scrollBy(0, -12);
            else if (e2.clientY > vh - 110) window.scrollBy(0, 12);
          }
        }

        function cleanup() {
          if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
          if (lastTarget) lastTarget.classList.remove("dropon");
          row.classList.remove("dragging");
          grip.removeEventListener("pointermove", onMove);
          grip.removeEventListener("pointerup", onUp);
          grip.removeEventListener("pointercancel", onCancel);
        }

        function onUp(e3) {
          var card = moved ? targetAt(e3.clientX, e3.clientY) : null;
          cleanup();
          if (!moved) return;                       // a tap, not a drag
          if (!card) return;
          var dropId = card.getAttribute("data-drop");
          if (dropId === ownGroupId(name)) return;  // dropped back where it started
          dropInto(name, dropId);
        }
        function onCancel() { cleanup(); }

        grip.addEventListener("pointermove", onMove);
        grip.addEventListener("pointerup", onUp);
        grip.addEventListener("pointercancel", onCancel);
      });
    }
  }

  function ownGroupId(name) {

    else if (dropId.indexOf("solo:") === 0) {
      var partner = dropId.slice(5);

      setMeal(e, name, +dropId.slice(1));

  function setupCrop() {
    var c = document.getElementById("cropc");
    if (!c || !shot) return;
    var maxW = Math.min(c.parentNode.clientWidth || 340, 520);
    var scale = maxW / shot.width;
    c.width = Math.round(shot.width * scale);
    c.height = Math.round(shot.height * scale);
    cropView = { scale: scale };
    drawCrop();

    var dragging = false, start = null;
    function pos(ev) {
      var r = c.getBoundingClientRect();
      var t = ev.touches ? ev.touches[0] : ev;
      return { x: (t.clientX - r.left) * (c.width / r.width),
               y: (t.clientY - r.top) * (c.height / r.height) };
    }
    function down(ev) { ev.preventDefault(); dragging = true; start = pos(ev); cropBox = null; drawCrop(); }
    function move(ev) {
      if (!dragging) return;
      ev.preventDefault();
      var p = pos(ev);

                  w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };

    }
    function up() { dragging = false; }
    c.addEventListener("touchstart", down, { passive: false });
    c.addEventListener("touchmove", move, { passive: false });
    c.addEventListener("touchend", up);
    c.addEventListener("mousedown", down);
    c.addEventListener("mousemove", move);
    c.addEventListener("mouseup", up);
  }

  function drawCrop() {
    var c = document.getElementById("cropc");
    if (!c || !shot) return;
    var ctx = c.getContext("2d");
    ctx.drawImage(shot, 0, 0, c.width, c.height);
    if (cropBox && cropBox.w > 6 && cropBox.h > 6) {
      ctx.fillStyle = "rgba(9,11,22,.66)";
      ctx.fillRect(0, 0, c.width, cropBox.y);
      ctx.fillRect(0, cropBox.y + cropBox.h, c.width, c.height - cropBox.y - cropBox.h);
      ctx.fillRect(0, cropBox.y, cropBox.x, cropBox.h);
      ctx.fillRect(cropBox.x + cropBox.w, cropBox.y, c.width - cropBox.x - cropBox.w, cropBox.h);

    if (window.Tesseract) return Promise.resolve();

    tessLoading = new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = res;
      s.onerror = function () { tessLoading = null; rej(new Error("load")); };

        logger: function (m) {

  function ingredientSection(text) {
    var lines = String(text || "").split(/\n+/);
    var start = -1, i;
    for (i = 0; i < lines.length; i++) { if (ING_HEAD.test(lines[i])) { start = i; break; } }
    if (start < 0) return null;
    var out = [lines[start].replace(new RegExp("^.*?" + "ingredien\\w*\\s*[:.-]?", "i"), "")];
    for (i = start + 1; i < lines.length; i++) {

  // ---- honest Patterns: how likely is each difference to be chance?

  function shuffleP(A, B, seed) {

  function underLogged() {

         + ' <b>Correlation, not cause.</b></div>';
      var shown = res.filter(function (r) { return patShowAll || r.ev !== "none"; });
      if (!shown.length) h += '<div class="note">Nothing stands out from chance yet.</div>';
      shown.forEach(function (r) {
        var k = kindOf(r.tag), cls = r.delta>0?"up":r.delta<0?"down":"";
        h += '<div class="row' + (r.ev === "none" ? " dim" : "") + '"><div><div class="rowname">'
           + '<span class="ev ' + r.ev + '">' + r.ev + '</span>'
           + (r.routine?'<span class="kind rtk">routine</span>':k==="ing"?'<span class="kind ing">ingredient</span>':k==="food"?'<span class="kind">product</span>':'')
           + esc(r.tag)
           + (r.byAmount ? '<span class="kind" style="margin-left:7px;margin-right:0">'
               + (r.peaked ? "per meal" : "by amount") + '</span>' : '')
           + (r.flag ? '<span class="kind flagk">' + r.flag + '</span>' : '')
           + '</div><div class="rowmeta">'
           + (r.byAmount
               ? r.a.toFixed(1)+' on heavier days, ~'+r.hiAvg+'g ('+r.na+'d) · '+r.b.toFixed(1)+' on lighter days ('+r.nb+'d)'
               : r.routine
               ? r.a.toFixed(1)+' after skipping ('+r.na+'d) · '+r.b.toFixed(1)+' after doing it ('+r.nb+'d)'
               : r.a.toFixed(1)+' with ('+r.na+'d) · '+r.b.toFixed(1)+' without ('+r.nb+'d)')
           + ' · as big in ' + (r.p < 0.01 ? '<1' : Math.round(r.p * 100)) + '% of shuffles'
           + '</div></div>'
           + '<div class="delta '+cls+'">'+(r.delta>0?"+":"")+r.delta.toFixed(1)+'</div></div>';
      });
      if (nNone) h += '<button class="btn" data-patall="1">' + (patShowAll ? 'Hide the ' : 'Show the ') + nNone + ' with no evidence</button>';
    }
    return h+'</div>';
  }

  // ---- trend chart: spots over time, with any number of groups overlaid
  var TRENDCOLS = ["#4FBFA8","#E8B84B","#7FA6E8","#C88CE0","#E89A5B","#8FD46A"];
  var TRENDABLE = ["Dairy","Added sugar","Sugar (from labels)","High GI","Whey / casein","Gluten / wheat",
                   "Red meat","Seed oils","Caffeine","Artificial sweetener","Cocoa / chocolate"];

  function trendChart() {
    var ks = Object.keys(state.days).sort();
    if (ks.length < 5) return "";
    if (ks.length > 60) ks = ks.slice(-60);

    var spots = ks.map(function (k) { return metric(state.days[k], measure); });
    var series = trendGroups.map(function (t) {
      return { name: t, v: ks.map(function (k) {
        if (t === SUGAR_T) {
          var nd = nutDay(state.days[k], "sugar");
          return (nd.of && nd.known / nd.of >= SUGAR_MIN_COVER) ? nd.g : null;   // mostly unknown: leave a gap
        }
        return dose(state.days[k], t);
      }) };
    });
    if (trendSum && series.length > 1) {
      var summed = ks.map(function (_, i) {
        var anyGap = series.some(function (s2) { return s2.v[i] == null; });
        return anyGap ? null : series.reduce(function (a, s2) { return a + s2.v[i]; }, 0);
      });
      series = [{ name: "combined (" + trendGroups.length + " groups)", v: summed, sum: true }];
    }

    var W = 700, H = 200, PL = 34, PR = 10, PT = 14, PB = 26;
    var iw = W - PL - PR, ih = H - PT - PB;
    var sMax = Math.max(3, Math.max.apply(null, spots.map(function (v) { return v == null ? 0 : v; })));
    var oMax = 1;
    series.forEach(function (s2) { oMax = Math.max(oMax, Math.max.apply(null, s2.v)); });
    var x = function (i) { return PL + (ks.length < 2 ? 0 : i * iw / (ks.length - 1)); };
    var ys = function (v) { return PT + ih - (v / sMax) * ih; };
    var yo = function (v) { return PT + ih - (v / oMax) * ih; };

    var h = '<div class="grp"><div class="grph">Trend</div>'
      + '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
    for (var g = 0; g <= 2; g++) {
      var gy = PT + ih - (g / 2) * ih;
      h += '<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + gy.toFixed(1)
        + '" stroke="#262E52" stroke-width="1"/>'
        + '<text x="4" y="' + (gy + 4).toFixed(1) + '" fill="#5B639A" font-size="11">'
        + Math.round(sMax * g / 2) + '</text>';
    }
    ks.forEach(function (k, i) {
      if ((state.days[k].t || []).indexOf(LASER) >= 0)
        h += '<line x1="' + x(i).toFixed(1) + '" y1="' + PT + '" x2="' + x(i).toFixed(1)
          + '" y2="' + (PT + ih) + '" stroke="#E8B84B" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>';
    });
    series.forEach(function (s2, si) {
      var col = s2.sum ? "#FFFFFF" : TRENDCOLS[si % TRENDCOLS.length];
      var segs = [], cur = [];
      s2.v.forEach(function (v, i) {
        if (v == null) { if (cur.length) segs.push(cur); cur = []; return; }
        cur.push([x(i).toFixed(1), yo(v).toFixed(1)]);
      });
      if (cur.length) segs.push(cur);
      segs.forEach(function (sg) {
        if (sg.length === 1) { h += '<circle cx="' + sg[0][0] + '" cy="' + sg[0][1] + '" r="2.5" fill="' + col + '"/>'; return; }
        h += '<polyline points="' + sg.map(function (q) { return q.join(","); }).join(" ") + '" fill="none" stroke="' + col
          + '" stroke-width="' + (s2.sum ? 2.5 : 2) + '" opacity="' + (s2.sum ? ".9" : ".8") + '"/>';
      });
    });
    var sp = [], seg = [];
    spots.forEach(function (v, i) {
      if (v == null) { if (seg.length) sp.push(seg); seg = []; return; }
      seg.push(x(i).toFixed(1) + "," + ys(v).toFixed(1));
    });
    if (seg.length) sp.push(seg);
    sp.forEach(function (segment) {
      h += '<polyline points="' + segment.join(" ") + '" fill="none" stroke="#E4737E" stroke-width="2.5"/>';
    });
    spots.forEach(function (v, i) {
      if (v == null || v === 0) return;
      h += '<circle cx="' + x(i).toFixed(1) + '" cy="' + ys(v).toFixed(1) + '" r="3" fill="#E4737E"/>';
    });
    // routine strip: red where a step was skipped, green where every step was recorded done
    var rtIds = routineSteps().map(function (s3) { return s3.id; }), rtAny = false;
    ks.forEach(function (k, i) {
      var st = routineState(state.days[k], rtIds);
      if (st == null) return;
      rtAny = true;
      h += '<rect x="' + (x(i) - 2).toFixed(1) + '" y="' + (PT + ih + 3) + '" width="4" height="4" rx="1" fill="'
        + (st === 1 ? "#E4737E" : "#4FBFA8") + '" opacity=".85"/>';
    });
    h += '<text x="' + PL + '" y="' + (H - 6) + '" fill="#5B639A" font-size="11">'
      + parseD(ks[0]).toLocaleDateString(undefined, { day: "numeric", month: "short" }) + '</text>'
      + '<text x="' + (W - PR) + '" y="' + (H - 6) + '" text-anchor="end" fill="#5B639A" font-size="11">'
      + parseD(ks[ks.length - 1]).toLocaleDateString(undefined, { day: "numeric", month: "short" }) + '</text>'
      + '</svg>';

    h += '<div class="legend"><span class="key spots"></span>'
      + esc(MEASURES.filter(function (m) { return m[0] === measure; })[0][1]);
    series.forEach(function (s2, si) {
      var col = s2.sum ? "#FFFFFF" : TRENDCOLS[si % TRENDCOLS.length];
      h += '<span class="key" style="background:' + col + '"></span>' + esc(s2.name);
    });
    if (rtAny) h += '<span class="key" style="background:#E4737E;height:4px"></span>routine skipped'
                 + '<span class="key" style="background:#4FBFA8;height:4px"></span>routine done';
    if (series.length) h += '<span class="scaleno">all groups 0\u2013' + Math.round(oMax) + ' g</span>';
    h += '</div>';

    h += '<div class="chips trendchips">';
    TRENDABLE.forEach(function (t, i) {
      var on = trendGroups.indexOf(t) >= 0;
      var col = on ? TRENDCOLS[trendGroups.indexOf(t) % TRENDCOLS.length] : "";
      h += '<button class="chip' + (on ? " on" : "") + '" data-trend="' + esc(t) + '"'
        + (on && !trendSum ? ' style="border-color:' + col + ';color:' + col + '"' : "") + '>'
        + esc(t.split(" ")[0]) + '</button>';
    });
    h += '</div>';
    if (trendGroups.length > 1) {
      h += '<div class="chips" style="margin-top:6px">'
        + '<button class="chip' + (trendSum ? " on" : "") + '" data-trendsum="1">'
        + (trendSum ? "\u2713 " : "") + 'Add them together</button>'
        + '<button class="chip" data-trendclear="1">Clear all</button></div>';
    }
    return h + '</div>';
  }

  function laserPanel() {
    var sessions = Object.keys(state.days).filter(function (d) {
      var e = state.days[d]; return e && e.t && e.t.indexOf(LASER) >= 0; }).sort();
    if (!sessions.length) return "";
    var buckets = []; for (var i=0;i<=14;i++) buckets.push([]);
    Object.keys(state.days).forEach(function (d) {
      var v = metric(state.days[d], measure); if (v == null) return;
      var best = null;
      sessions.forEach(function (s) { var g = diffDays(s,d); if (g>=0 && g<=14 && (best===null||g<best)) best = g; });
      if (best !== null) buckets[best].push(v);
    });
    var avgs = buckets.map(function (b) { return b.length ? mean(b) : null; });
    var max = Math.max.apply(null, avgs.map(function (a) { return a==null?0:a; }));
    if (!max) return "";
    var h = '<div class="grp"><div class="grph">After a laser session</div>'
      + '<div class="rowmeta" style="margin-bottom:4px">'+sessions.length+' session'
      + (sessions.length===1?"":"s")+' · average by days since</div><div class="lwrap">';
    avgs.forEach(function (a, i) {
      h += '<div class="lcol"><div class="lbar'+(a!=null&&a>=max*0.85?" hot":"")+'" style="height:'
         + (a==null?2:Math.max(2,Math.round((a/max)*76)))+'px"></div><div class="lday">'+i+'</div></div>';
    });
    return h + '</div><div class="rowmeta">Day 0 is the session. A bump in the first week is usually '
      + 'the laser and the retinal break, not your diet.</div></div>';
  }

  function analyse(l, m) {
    var out = [], days = Object.keys(state.days), cache = {};
    days.forEach(function (d) { cache[d] = effective(state.days[d]); });
    var thin = patGuard ? underLogged() : {};
    var rtIds = routineSteps().map(function (s) { return s.id; });
    var keepDay = function (sd) { return patFilter !== "routine" || routineClean(state.days[sd]); };

    allTags().forEach(function (t) {
      var byAmount = (mode === "amount" || mode === "peak") && doseable(t);
      var peaked = (mode === "peak");
      var foodish = kindOf(t) !== "tag";
      var pairs = [];
      days.forEach(function (d) {
        var v = metric(state.days[d], m); if (v == null) return;
        var sd = shift(d, -l), src = state.days[sd];
        if (!touched(src)) return;
        if (foodish && thin[sd]) return;          // "not logged" must not read as "not eaten"
        if (!keepDay(sd)) return;
        pairs.push({ v: v, on: (cache[sd]||[]).indexOf(t) >= 0,
                     g: byAmount ? (peaked ? peakDose(src, t) : dose(src, t)) : 0 });
      });
      if (pairs.length < 6) return;

      var A = [], B = [], cut = null;
      if (byAmount) {
        cut = median(pairs.map(function (p) { return p.g; }));
        // a median of zero means most days have none — fall back to any-vs-none
        if (cut <= 0) cut = 0;
        pairs.forEach(function (p) { (p.g > cut ? A : B).push(p.v); });
      } else {
        pairs.forEach(function (p) { (p.on ? A : B).push(p.v); });
      }
      if (A.length < 3 || B.length < 3) return;
      var a = mean(A), b = mean(B);
      out.push({ tag:t, a:a, b:b, delta:a-b, na:A.length, nb:B.length, A:A, B:B,
                 byAmount: byAmount, peaked: peaked, cut: cut,
                 hiAvg: byAmount ? Math.round(mean(pairs.filter(function(p){return p.g>cut;}).map(function(p){return p.g;}))) : null });
    });

    // real sugar grams from nutrition tables, only on days where most foods have a value;
    // a day that is mostly unknown would otherwise look like a low-sugar day
    (function () {
      var pairs = [];
      days.forEach(function (d) {
        var v = metric(state.days[d], m); if (v == null) return;
        var sd = shift(d, -l), src = state.days[sd];
        if (!touched(src) || !keepDay(sd)) return;
        var nd = nutDay(src, "sugar");
        if (!nd.of || nd.known / nd.of < SUGAR_MIN_COVER) return;
        pairs.push({ v: v, g: nd.g });
      });
      if (pairs.length < 6) return;
      var cut = median(pairs.map(function (p) { return p.g; })), A = [], B = [];
      pairs.forEach(function (p) { (p.g > cut ? A : B).push(p.v); });
      if (A.length < 3 || B.length < 3) return;
      out.push({ tag: SUGAR_T, a: mean(A), b: mean(B), delta: mean(A) - mean(B), na: A.length, nb: B.length, A: A, B: B,
                 byAmount: true, cut: cut, hiAvg: Math.round(mean(pairs.filter(function (p) { return p.g > cut; }).map(function (p) { return p.g; }))) });
    })();

    // routine steps: compared only across days where the step was recorded either way
    if (patFilter !== "routine") routineFactors().forEach(function (rf) {
      var A = [], B = [];
      days.forEach(function (d) {
        var v = metric(state.days[d], m); if (v == null) return;
        var st = routineState(state.days[shift(d, -l)], rf.ids);
        if (st == null) return;
        (st === 1 ? A : B).push(v);
      });
      if (A.length < 3 || B.length < 3) return;
      var a = mean(A), b = mean(B);
      out.push({ tag: rf.label, a: a, b: b, delta: a - b, na: A.length, nb: B.length, A: A, B: B, routine: true });
    });
    return out;
  }
  function mean(a) { var s=0; for (var i=0;i<a.length;i++) s+=a[i]; return s/a.length; }

  function vLog() {
    var days = Object.keys(state.days).sort();
    var h = '<div class="wrap" style="padding-top:22px"><h2 class="sec">Your log</h2>'
      + '<div class="sub">'+days.length+' '+(days.length===1?"day":"days")+' recorded · '
      + state.foods.length+' saved foods.'
      + (days.length ? '<br>' + esc(
          parseD(days[0]).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})
          + " \u2192 " +
          parseD(days[days.length-1]).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})
        ) : '')
      + '</div>';
    var r = state.routine || {};
    h += '<div class="grp"><div class="grph">Standing routine</div>';
    if (!r.am && !r.pm && !r.notes) {
      h += '<div class="note">Not set. Write down what you do every day — it never gets tagged, '
         + 'because a constant can\'t explain a change, but it\'s worth having on the record so you '
         + 'know what your baseline was months from now.</div>';
    } else {
      [["Morning", r.am], ["Night", r.pm], ["Notes", r.notes]].forEach(function (p) {
        if (!p[1]) return;

        p[1].split("\n").forEach(function (s) {

        });

    h += '<button class="btn" data-routine="1">'+(r.am||r.pm?"Edit routine":"Add your routine")+'</button>'
       + '<div class="rowmeta" style="margin-top:10px">Stored on this phone only — never in the app\'s '
       + 'code, so hosting it publicly gives nothing away.</div></div>';

    h += '<div class="grp"><div class="grph">Label reader</div>'
       + '<div class="rowmeta" style="margin-bottom:8px">'
       + (state.reader ? 'Using your own AI reader.' : 'Using on-device text recognition — free, works offline, occasionally garbles small print.')
       + '</div><button class="btn" data-reader="1">'

    var bytes = 0;

           + " \u2192 " + parseD(allDays[allDays.length-1]).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
    }

       + (db === null ? "Never backed up." : db === 0 ? "Backed up today." : "Last backup "+db+" day"+(db===1?"":"s")+" ago.")
       + ' Your log lives only on this phone — send a backup to Files or Notes every couple of weeks.'
       + '<br>Using ' + kb + ' KB. There is no cap on how many days you keep — at this rate a decade of '
       + 'logging is still a rounding error against the browser\'s storage limit.'
       + '</div></div>';

    h += '<div class="grp"><div class="grph">Entries</div>';

      var e = state.days[d], k = e.k||{};

         + (e.nw ? e.nw+' new · ' : '')
         + (e.k ? (k.co||0)+' clogged · '+(k.inf||0)+' inflamed · '+(k.dp||0)+' deep' : 'no breakdown')
         + '</div></div><div class="delta">'+(totalOf(e)==null?"–":totalOf(e))+'</div></div>';
    });
    return h+'</div></div>';
  }

  function csv() {
    var tags = allTags();
    var doseCols = tags.filter(doseable);
    var rows = ["date,new_today,total,clogged,inflamed,deep,skinfeel,zones,meals,"
      + tags.map(function(t){return '"'+t+'"';}).join(",")
      + (doseCols.length ? "," + doseCols.map(function(t){return '"'+t+' (g)"';}).join(",") : "")
      + ",notes"];
    Object.keys(state.days).sort().forEach(function (d) {
      var e = state.days[d], k = e.k||{}, eff = effective(e);
      var cells = [d, e.nw==null?"":e.nw, totalOf(e)==null?"":totalOf(e), k.co==null?"":k.co,
        k.inf==null?"":k.inf, k.dp==null?"":k.dp, e.s==null?"":e.s, '"'+(e.z||[]).join("; ")+'"',
        '"'+mealGroups(e).map(function(g){return g.foods.join(" + ");}).join(" | ")+'"'];
      tags.forEach(function (t) { cells.push(eff.indexOf(t)>=0?1:0); });
      doseCols.forEach(function (t) { cells.push(dose(e, t)); });
      cells.push('"'+String(e.n||"").replace(/"/g,'""')+'"');
      rows.push(cells.join(","));
    });
    return rows.join("\n");
  }

  function copyOut(text, btn, label) {
    function done() { btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = label; }, 1600); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(text, done); });
    } else fallback(text, done);
  }
  function fallback(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); done(); } catch (e) { ta.style.opacity = "1"; }
    document.body.removeChild(ta);
  }

  function nav() {
    var items = [["today","Today"],["foods","Foods"],["patterns","Patterns"],["log","Log"]];
    var h = '<div class="nav">';
    items.forEach(function (i) { h += '<button data-view="'+i[0]+'" class="'+(view===i[0]?"on":"")+'">'+i[1]+'</button>'; });
    return h+'</div>';
  }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function bind() {
    document.getElementById("app").onclick = function (ev) {
      var t = ev.target.closest("button"); if (!t) return;
      var d = t.dataset;

      if (d.close) return closeSheet();
      if (d.help) return openSheet("help");
      if (d.intake) return openSheet("intake", { date: sel });
      if (d.szest) { grabDraft(); draft.szEst = d.szest === "1"; return openSheet("food", draft); }
      if (d.nuttyp) { grabDraft(); var wasTyp = !!draft.nutTyp; draft.nutTyp = d.nuttyp === "1"; if (wasTyp && !draft.nutTyp) draft.nutFrom = ""; return openSheet("food", draft); }
      if (d.nutskip) { grabDraft(); draft.nutSkip = d.nutskip === "1"; return openSheet("food", draft); }
      if (d.routine) return openSheet("routine");
      if (d.saveroutine) {
        var am = document.getElementById("ram"), pm = document.getElementById("rpm"), no = document.getElementById("rno");
        var keepR = state.routine || {};
        state.routine = { am: am?am.value.trim():"", pm: pm?pm.value.trim():"", notes: no?no.value.trim():"",
                          steps: keepR.steps, backfilled: keepR.backfilled };
        sheet = null; save(); return render();
      }
      if (d.newfood) { searchHits = []; draft = {name:"",flags:[],ingredients:[],items:[],raw:"",rawFull:"",
        sz:null,u:"g",cat:"",catTouched:false,barcode:"",labelPhoto:"",dbState:"",fromDB:false,
        once:(d.newfood==="once"),editing:null,editingOnce:null}; return openSheet("food"); }
      if (d.edit) {
        var ef = state.foods[+d.edit];
        if (!ef) return;
        draft = { name: ef.n, flags: (ef.fl||[]).slice(), ingredients: (ef.ing||[]).slice(),
                  items: (ef.items||[]).map(function (it) { return { n:it.n, p:it.p, est:it.est, fl:(it.fl||[]).slice() }; }),
                  raw: ef.raw || (ef.ing||[]).join(", "), rawFull: ef.rawFull || "",
                  sz: ef.sz == null ? null : ef.sz, u: ef.u || "g", nut: ef.nut ? JSON.parse(JSON.stringify(ef.nut)) : null, nutFrom: ef.nutFrom || "", nutTyp: !!ef.nutTyp, nutSkip: !!ef.nutSkip, szEst: !!ef.szEst,
                  cat: catOf(ef), catTouched: true, barcode: ef.barcode || "", editing: ef.n };
        return openSheet("food", draft);
      }

  // ---------- zoom, pan and taps on a stage ----------
  function clampZoom() {
    ZP.z = Math.max(1, Math.min(8, ZP.z));
    ZP.x = Math.max(1 - ZP.z, Math.min(0, ZP.x));
    ZP.y = Math.max(1 - ZP.z, Math.min(0, ZP.y));
  }
  function applyZoom() {
    clampZoom();
    var L = document.getElementById("photolayer"); if (!L) return;
    var tf = zoomTf();
    [].forEach.call(L.querySelectorAll(".zl"), function (el) { el.style.transform = tf; });
    [].forEach.call(L.querySelectorAll(".zreset"), function (b) { b.hidden = ZP.z <= 1.01; });

  function wireGestures(el, o) {

        g.moved = true;
        if (!g.multi && o.drag && (!o.grab || g.grab)) { g.drag = true; o.drag("start", g.s.u, g.s.v, 0, 0); }
      }
      if (!g.moved) return;
      if (g.drag) o.drag("move", p.u, p.v, p.u - g.s.u, p.v - g.s.v);

    });

        else if (!cancelled && !was.multi && !was.moved && Date.now() - was.t0 < 600) {
          var pu = (p.u - ZP.x) / ZP.z, pv = (p.v - ZP.y) / ZP.z, now = Date.now();
          if (o.dbl && lastTap && now - lastTap.t < 320 && Math.hypot(p.px - lastTap.px, p.py - lastTap.py) < 30) {

  }

  function setWipe(pct) {
    VW.wipe = Math.max(0, Math.min(100, Math.round(pct)));
    var tw = document.getElementById("cmptopwrap"), wl = document.querySelector("#photolayer .wipeline"), wi = document.getElementById("wipe");
    var c = "inset(0 " + (100 - VW.wipe) + "% 0 0)";

  function flick() {

  var alignTimer = null;
  function saveOtherAlignSoon() {

  }

  function viewerClick(d, t) {
    if (d.pvclose) return closeLayer();
    if (d.zreset) { ZP = { z: 1, x: 0, y: 0 }; return applyZoom(); }
    if (d.pvangle) return openViewer(VW.date, d.pvangle, VW.mode);
    if (d.pvtake) return openCamera(VW.date, d.pvtake, VW.angle);
    if (d.pvmode) {
      VW.mode = d.pvmode; VW.delArmed = false; VW.nudge = false; VW.selMark = null; VW.undo = null;
      if (VW.mode === "cmp" && !VW.other) return loadOther(prevPhotoKey(VW.date, VW.angle)).then(drawViewer);
      if (VW.mode === "red") return runRedness();
      return drawViewer();
    }
    if (d.cmpmode) { VW.cmpMode = d.cmpmode; VW.nudge = false; return drawViewer(); }
    if (d.cmpstep) { VW.nudge = false; return loadOther(d.cmpstep).then(drawViewer); }
    if (d.cmpnudge) { VW.nudge = !VW.nudge; return drawViewer(); }

  function deletePhoto() {
    var date = VW.date, angle = VW.angle, k = phKey(date, angle);
    return phDel(k).then(function () {
      delete PH.keys[k]; phForget(k);
      photoGone(date, angle);
      var other = ANGLES.filter(function (a) { return PH.keys[phKey(date, a[0])]; })[0];
      if (other) return openViewer(date, other[0]);
      closeLayer();
    }).catch(function () { pvStatus("Couldn’t delete it — try again."); });
  }

  // mirror the stored photo, for a camera-app picture that came out the other way round
  function flipPhoto() {
    var key = phKey(VW.date, VW.angle), rec = VW.rec;
    if (!rec) return;

    return loadImg(VW.url).then(function (im) {
      var c = document.createElement("canvas"); c.width = c.height = PHOTO_PX;
      var ctx = c.getContext("2d"); ctx.translate(PHOTO_PX, 0); ctx.scale(-1, 1);
      ctx.drawImage(im, 0, 0, PHOTO_PX, PHOTO_PX);

      VW.url = URL.createObjectURL(rec.blob);

  }

  // ---------- marks: spots tapped on a photo ----------
  // A mark is {id, a: angle, x, y: photo coords, t: "co"|"inf"|"dp", ph: the photo's timestamp}.
  // It lives on the day (so it is in the backup). A spot tapped again on a later day keeps its id,
  // which is how "still there" and "new" are told apart. Marks never change the counts by
  // themselves — only "Set the day's counts from marks" does, and that can be undone.
  var MARK_R = 13;                             // mark radius on screen, px
  function typeInfo(k) { for (var i = 0; i < TYPES.length; i++) if (TYPES[i].k === k) return TYPES[i]; return TYPES[1]; }
  function dayMarks(date) { var e = state.days[date]; return (e && e.marks) || []; }
  function angleMarks(date, angle) { return dayMarks(date).filter(function (m) { return m.a === angle; }); }
  function markDay(date) {
    var e = state.days[date];
    if (!e) e = state.days[date] = { s: null, t: [], f: [], fa: {}, m: {}, oneoff: [], z: [], n: "" };  // no counts: a mark is not a count
    if (!e.marks) e.marks = [];
    return e;
  }
  function emptyVal(v) {
    if (v == null || v === "" || v === 0 || v === false) return true;
    if (Array.isArray(v)) return !v.length;
    if (typeof v === "object") return !Object.keys(v).length;
    return false;
  }
  function pruneDay(date) {                    // a day that only ever held marks goes away with its last mark
    var e = state.days[date]; if (!e) return;
    if ("k" in e || "c" in e || "nw" in e) return;
    for (var key in e) if (!emptyVal(e[key])) return;
    delete state.days[date];
  }
  function newMarkId() { return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function r4(v) { return Math.round(v * 10000) / 10000; }
  function toShared(p, al) { al = al || { dx: 0, dy: 0, s: 1 }; return { x: (p.x - 0.5) * al.s + 0.5 + al.dx, y: (p.y - 0.5) * al.s + 0.5 + al.dy }; }
  function fromShared(c, al) { al = al || { dx: 0, dy: 0, s: 1 }; return { x: (c.x - 0.5 - al.dx) / al.s + 0.5, y: (c.y - 0.5 - al.dy) / al.s + 0.5 }; }
  function findMark(id) { var ms = dayMarks(VW.date); for (var i = 0; i < ms.length; i++) if (ms[i].id === id) return ms[i]; return null; }

  // the latest earlier day with marks on this angle: its marks show as rings to tap "still there"
  function ringSource(date, angle) {
    var best = null;
    for (var d in state.days) if (d < date && (!best || d > best) && angleMarks(d, angle).length) best = d;
    return best;
  }
  function loadRings() {
    VW.ring = null;
    var rd = ringSource(VW.date, VW.angle), angle = VW.angle, date = VW.date;
    if (!rd) return Promise.resolve();
    return phGet(phKey(rd, angle)).catch(function () { return null; }).then(function (rec) {
      if (VW.date !== date || VW.angle !== angle) return;
      VW.ring = { date: rd, marks: angleMarks(rd, angle), align: (rec && rec.align) || { dx: 0, dy: 0, s: 1 } };
    });
  }
  function ringPos(m) { return fromShared(toShared(m, VW.ring.align), VW.rec && VW.rec.align); }
  function openRings() {
    if (!VW.ring) return [];
    var ids = {}; angleMarks(VW.date, VW.angle).forEach(function (m) { ids[m.id] = 1; });
    return VW.ring.marks.filter(function (m) { return !ids[m.id]; });
  }

  // which face zone a mark sits in, from where it is inside the guide oval when the photo was taken
  function markZone(m) {
    var u = (m.x - OVAL.cx) / OVAL.rx, v = (m.y - OVAL.cy) / OVAL.ry, au = Math.abs(u);
    if (v > 1.02) return "Neck";
    if (m.a !== "front") return v < -0.35 ? "Temples" : v > 0.5 ? "Jaw / chin" : "Cheeks";
    if (v < -0.25) return au > 0.62 ? "Temples" : "Forehead";
    if (au > 0.62 && v < 0.05) return "Temples";
    if (au < 0.2 && v < 0.35) return "Nose";
    if (v >= 0.72 || (au > 0.62 && v > 0.4)) return "Jaw / chin";
    if (au < 0.38 && v >= 0.35) return "Around mouth";

    if (!r || !r.heat) { cv.style.display = "none"; return; }
    cv.style.display = "";
    if (cv.width !== r.N) { cv.width = r.N; cv.height = r.N; }
    cv.getContext("2d").putImageData(r.heat, 0, 0);
  }
  function visibleCands() {
    var r = VW.red && VW.red.res; if (!r || !r.cands) return [];
    var th = RED_T[VW.sens] || RED_T.normal, ms = angleMarks(VW.date, VW.angle);
    return r.cands.filter(function (c) {
      if (c.z < th) return false;
      return !ms.some(function (m) { return Math.hypot(m.x - c.x, m.y - c.y) < Math.max(0.012, c.r * 1.5); });   // already marked
    });
  }
  function candSVG(k, R) {
    if (VW.mode !== "red") return "";
    var h = "";
    visibleCands().forEach(function (c) {
      var rr = Math.max(R, c.r * 1000 + 5 * k), x = (c.x * 1000).toFixed(1), y = (c.y * 1000).toFixed(1);
      h += '<circle cx="' + x + '" cy="' + y + '" r="' + rr.toFixed(2) + '" class="mk halo lite" stroke-width="' + (4.5 * k).toFixed(2) + '"/>'
        + '<circle cx="' + x + '" cy="' + y + '" r="' + rr.toFixed(2) + '" class="mk cand" stroke-width="' + (2.5 * k).toFixed(2)
        + '" stroke-dasharray="' + (6 * k).toFixed(2) + ' ' + (4 * k).toFixed(2) + '"/>';
    });
    return h;
  }
  function candTap(pu, pv) {
    var hr = hitR() * 1.3, best = null, bd = 1e9;
    visibleCands().forEach(function (c) { var d = Math.hypot(c.x - pu, c.y - pv); if (d <= Math.max(hr, c.r * 1.3) && d < bd) { bd = d; best = c; } });
    if (!best) { VW.redMsg = "Nothing suggested there. To add a spot the map missed, use Mark spots."; return redrawMarks(); }
    var ring = VW.ring ? nearestTo(openRings(), best.x, best.y, 0.015, ringPos) : null;
    markDay(VW.date).marks.push({ id: ring ? ring.id : newMarkId(), a: VW.angle, x: r4(best.x), y: r4(best.y), t: VW.type, ph: (VW.rec && VW.rec.ts) || 0 });
    VW.undo = null; VW.redMsg = "";
    save(); redrawMarks();
  }
  function typeChipsHTML(ms, sel) {
    var h = '<div class="chips mtypes">';
    TYPES.forEach(function (t) {
      var n = ms.filter(function (m) { return m.t === t.k; }).length, on = sel ? sel.t === t.k : VW.type === t.k;
      h += '<button class="chip' + (on ? ' on' : '') + '" data-mtype="' + t.k + '"><span class="mdot" style="background:' + t.col + '"></span>'
        + esc(t.name) + (n ? ' · ' + n : '') + '</button>';
    });
    return h + '</div>';
  }
  function redPanelHTML() {
    var r = VW.red && VW.red.res, ms = angleMarks(VW.date, VW.angle);
    var h = '<div class="chips redctl">'
      + [["fewer", "Fewer"], ["normal", "Normal"], ["more", "More"]].map(function (s) {
          return '<button class="chip' + (VW.sens === s[0] ? ' on' : '') + '" data-rsens="' + s[0] + '">' + s[1] + '</button>'; }).join('')
      + '<button class="chip' + (VW.heatOn ? ' on' : '') + '" data-rheat="1">Map ' + (VW.heatOn ? 'on' : 'off') + '</button></div>';
    if (!r) h += '<div class="rowmeta">Looking for red patches…</div>';
    else if (r.err) h += '<div class="rowmeta">Couldn’t read this photo.</div>';
    else if (r.none) h += '<div class="note" style="margin-top:6px">No skin found inside the guide oval. The map only looks inside the oval you lined your face up with.</div>';
    else {
      var vc = visibleCands().length, th = RED_T[VW.sens] || RED_T.normal, all = r.cands.filter(function (c) { return c.z >= th; }).length;
      h += '<div class="rowmeta" style="margin-top:2px"><b style="color:var(--paper)">' + (vc ? vc + ' suggestion' + (vc === 1 ? '' : 's') : 'No suggestions') + '</b>'
        + (vc ? ' (gold circles). Tap the real ones to mark them as ' + esc(typeInfo(VW.type).name.toLowerCase()) + '.'
              : all ? ' left: everything it found here is already marked.' : ' at this setting. “More” looks harder.') + '</div>';
    }
    if (VW.redMsg) h += '<div class="rowmeta" style="color:var(--mark);margin-top:6px">' + esc(VW.redMsg) + '</div>';
    h += typeChipsHTML(ms, null);
    h += '<div class="rowmeta">The pink shows skin that is redder than the skin around it — the stronger the pink, the redder. It can’t see clogged or '
      + 'skin-coloured spots, and a nick, a vein or rough skin can light up too. Nothing counts until you tap it.</div>';
    return h + countsBoxHTML();
  }

  function loadImg(url) {
    return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = rej; im.src = url; });
  }
  function drawAligned(ctx, im, rec, x0, W) {
    var a = (rec && rec.align) || { dx: 0, dy: 0, s: 1 };
    ctx.save(); ctx.beginPath(); ctx.rect(x0, 0, W, W); ctx.clip();
    ctx.fillStyle = "#000"; ctx.fillRect(x0, 0, W, W);
    ctx.translate(x0 + W * (0.5 + a.dx), W * (0.5 + a.dy)); ctx.scale(a.s, a.s);
    ctx.drawImage(im, -W / 2, -W / 2, W, W);
    ctx.restore();
  }
  function composePair() {
    var W = 900, G = 12, od = otherDate();
    return Promise.all([loadImg(VW.otherURL), loadImg(VW.url)]).then(function (ims) {
      var c = document.createElement("canvas"); c.width = W * 2 + G; c.height = W + 70;
      var ctx = c.getContext("2d"); ctx.fillStyle = "#12162A"; ctx.fillRect(0, 0, c.width, c.height);
      drawAligned(ctx, ims[0], VW.otherRec, 0, W); drawAligned(ctx, ims[1], VW.rec, W + G, W);
      ctx.fillStyle = "#ECEAF4"; ctx.font = "600 32px system-ui, -apple-system, sans-serif"; ctx.textBaseline = "middle";
      var lab = function (d) { return parseD(d).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" }); };
      ctx.fillText(lab(od), 18, W + 36); ctx.fillText(lab(VW.date), W + G + 18, W + 36);
      return new Promise(function (res) { c.toBlob(res, "image/jpeg", 0.9); });
    });
  }
  function shareBlob(blob, name) {
    try {
      var file = new File([blob], name, { type: "image/jpeg" });
      if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file] }).catch(function () {});
      }
    } catch (e) {}
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function saveImageOut() {
    if (!VW.rec) return;
    if (VW.mode === "cmp" && VW.other && VW.otherRec) {
      pvStatus("Putting the pair together…");
      return composePair().then(function (b) {
        pvStatus("");
        if (b) shareBlob(b, "skinlog-" + otherDate() + "-vs-" + VW.date + "-" + VW.angle + ".jpg");
      }).catch(function () { pvStatus("Couldn’t make the pair image."); });
    }
    shareBlob(VW.rec.blob, "skinlog-" + VW.date + "-" + VW.angle + ".jpg");
  }

  // ---------- the phone's back button closes the photo screen instead of the app ----------
  var layerHist = false, popIgnore = 0;
  function layerPush() {
    if (layerHist || !window.history || !history.pushState) return;
    try { history.pushState({ skinlogPhoto: 1 }, ""); layerHist = true; } catch (e) {}
  }
  function layerPop() {
    if (!layerHist) return;
    layerHist = false; popIgnore++;
    try { history.back(); } catch (e) { popIgnore--; }
  }
  window.addEventListener("popstate", function () {
    if (popIgnore) { popIgnore--; return; }
    if (!layerHist) return;
    layerHist = false;
    if (layerOpen()) closeLayer(true);
  });

  load();
  phInit();
})();
</script>
</body>
