<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Skin Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skin Log">
<meta name="theme-color" content="#12162A">
<style>
  :root {
    --ink: #12162A; --ink-2: #1B2140; --ink-3: #262E52; --line: #333C68;
    --paper: #ECEAF4; --paper-dim: #9AA0C4; --faint: #5B639A;
    --flare: #E4737E; --calm: #4FBFA8; --mark: #E8B84B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  body { color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 15px; line-height: 1.45; min-height: 100vh;
    padding: env(safe-area-inset-top) 0 100px; -webkit-text-size-adjust: 100%; }
  .boot { padding: 80px 20px; text-align: center; color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    letter-spacing: .08em; text-transform: uppercase; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  .strip-shell { position: sticky; top: 0; z-index: 20;
    background: linear-gradient(var(--ink) 84%, rgba(18,22,42,0)); padding: 12px 16px 16px; }
  .weekhead { display: flex; align-items: baseline; justify-content: space-between;
    margin: 0 0 8px; }
  .wmonth { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim); }
  .wcal { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--mark);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; text-decoration: underline; }
  .week { display: flex; align-items: stretch; gap: 2px; }
  .wdays { display: flex; flex: 1; gap: 2px; }
  .warr { flex: 0 0 26px; background: none; border: 0; color: var(--paper-dim);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 0; }
  .warr.off { color: var(--ink-3); }
  .day { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center;
    gap: 4px; background: none; border: 1px solid transparent; border-radius: 12px;
    padding: 6px 0 5px; cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .day.sel { background: var(--ink-2); border-color: var(--paper); }
  .day.now .dnum { color: var(--mark); }
  .day.fut { opacity: .3; }
  .bar-slot { height: 48px; width: 100%; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; }
  .seg { width: 11px; }
  .seg.dp { background: var(--flare); border-radius: 3px 3px 0 0; }
  .seg.inf { background: #C9707F; }
  .seg.co { background: #6E6FA8; border-radius: 0 0 1px 1px; }
  .seg.none { background: var(--ink-3); height: 3px; border-radius: 2px; }
  .seg.zero { background: var(--calm); height: 4px; border-radius: 2px; }
  .dow { font-size: 8.5px; color: var(--faint); }
  .dnum { font-size: 11px; color: var(--paper-dim); }
  .day.sel .dnum, .day.sel .dow { color: var(--paper); }

  .calhead { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .calm { font-family: ui-serif, "New York", Georgia, serif; font-size: 17px; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calw { text-align: center; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 8.5px; color: var(--faint); padding-bottom: 2px; }
  .calc { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--ink-2); color: var(--paper); cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; padding: 0; }
  .calc.now { outline: 1px solid var(--mark); outline-offset: 1px; }
  .calc.sel { border-width: 2px; border-color: var(--paper); }
  .calc.fut { opacity: .25; }
  .calt { font-size: 8px; color: var(--paper); opacity: .8; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
  .date { font-family: ui-serif, "New York", Georgia, serif; font-size: 26px; font-weight: 500; }
  .saved { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--calm); opacity: 0; transition: opacity .3s; }
  .saved.on { opacity: 1; }

  .total { background: var(--ink-2); border: 1px solid var(--line); border-radius: 16px 16px 0 0;
    border-bottom: 0; padding: 14px 16px 12px; display: flex; align-items: baseline; gap: 12px; }
  .cnum { font-family: ui-serif, "New York", Georgia, serif; font-size: 42px; line-height: 1;
    font-weight: 500; font-variant-numeric: tabular-nums; }
  .clab { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim); }
  .types { background: var(--ink-2); border: 1px solid var(--line); border-radius: 0 0 16px 16px;
    padding: 4px 16px 12px; margin-bottom: 22px; }
  .trow { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .tdot { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .tname { flex: 1; font-size: 13.5px; line-height: 1.25; }
  .thint { display: block; font-size: 11px; color: var(--faint); }
  .tval { font-family: ui-serif, "New York", Georgia, serif; font-size: 20px;
    font-variant-numeric: tabular-nums; min-width: 26px; text-align: center; }
  .mini { width: 38px; height: 38px; border-radius: 11px; background: var(--ink-3);
    border: 1px solid var(--line); color: var(--paper); font-size: 19px; line-height: 1; cursor: pointer; }
  .mini:active { background: var(--line); }
  .trow.newrow { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 11px; }
  .helplink { display: block; width: 100%; margin-top: 8px; padding: 8px 0; background: none;
    border: 0; color: var(--paper-dim); cursor: pointer; text-align: left;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; text-decoration: underline; }

  .sev { display: flex; gap: 6px; }
  .sevb { flex: 1; padding: 9px 0; border-radius: 11px; background: var(--ink-2);
    border: 1px solid var(--line); color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .sevb.on { background: var(--mark); border-color: var(--mark); color: #2A2208; font-weight: 600; }

  .grp { margin-bottom: 22px; }
  .grph { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--paper-dim);
    margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .grph::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .tag { padding: 9px 13px; border-radius: 999px; background: var(--ink-2);
    border: 1px solid var(--line); color: var(--paper); font-size: 13.5px; cursor: pointer; }
  .tag.on { background: var(--paper); border-color: var(--paper); color: var(--ink); }
  .tag.add { border-style: dashed; color: var(--paper-dim); }
  .tag.scan { border-color: var(--mark); color: var(--mark); }
  .tag.once { border-color: var(--calm); color: var(--calm); }
  .tag.once.on { background: var(--calm); border-color: var(--calm); color: #0A2620; }
  .tag.once.dash { border-style: dashed; }
  .oncepill { display: inline-block; margin-left: 7px; padding: 1px 5px; border-radius: 5px;
    border: 1px solid var(--calm); color: var(--calm); vertical-align: 1px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 8px;
    letter-spacing: .08em; text-transform: uppercase; }
  .pactions { display: flex; gap: 12px; }
  .grip { flex: 0 0 auto; width: 26px; height: 34px; padding: 0; margin-right: 2px;
    background: none; border: 0; color: var(--faint); cursor: grab;
    font-size: 13px; line-height: 1; letter-spacing: -3px;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  .grip:active { cursor: grabbing; color: var(--paper); }
  .prow.dragging { opacity: .35; }
  .mealcard.dropon { border-color: var(--mark); background: rgba(232,184,75,.10); }
  .mealcard.newdrop { border-style: dashed; opacity: .65; }
  .mealcard.newdrop .mealh { color: var(--faint); }
  .dragghost { position: fixed; z-index: 90; pointer-events: none;
    background: var(--ink-3); border: 1px solid var(--mark); border-radius: 10px;
    color: var(--paper); padding: 9px 12px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }

  textarea, input[type=text] { width: 100%; background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 14px; color: var(--paper); padding: 12px 14px; font: inherit; font-size: 16px; }
  textarea { min-height: 76px; resize: vertical; }
  textarea::placeholder, input::placeholder { color: var(--faint); }
  :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

  .chips { display: flex; gap: 6px; margin: 4px 0 18px; flex-wrap: wrap; }
  .chip { flex: 1 1 auto; min-width: 70px; padding: 10px 8px; border-radius: 12px;
    background: var(--ink-2); border: 1px solid var(--line); color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; cursor: pointer; }
  .chip.on { background: var(--ink-3); border-color: var(--paper); color: var(--paper); }

  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--ink-3); }
  .rowname { font-size: 14.5px; }
  .rowmeta { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    color: var(--paper-dim); letter-spacing: .04em; margin-top: 3px; line-height: 1.5; }
  .delta { font-family: ui-serif, "New York", Georgia, serif; font-size: 19px;
    font-variant-numeric: tabular-nums; text-align: right; }
  .up { color: var(--flare); } .down { color: var(--calm); }
  .kind { display: inline-block; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px;
    border-radius: 5px; border: 1px solid var(--line); color: var(--paper-dim); margin-right: 7px; }
  .kind.ing { border-color: var(--mark); color: var(--mark); }

  .lwrap { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin: 6px 0 8px; }
  .lcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .lbar { width: 100%; background: var(--ink-3); border-radius: 3px 3px 0 0; min-height: 2px; }
  .lbar.hot { background: var(--flare); }
  .lday { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 8px; color: var(--faint); }

  .note { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; font-size: 13px; color: var(--paper-dim); line-height: 1.5; }
  .note b { color: var(--paper); font-weight: 600; }
  .warn { background: var(--ink-2); border: 1px solid var(--flare); border-radius: 14px;
    padding: 14px; margin: 14px 0 0; }
  .warnt { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--flare); }
  .meals { margin-top: 10px; }
  .mealcard { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 8px 14px 10px; margin-bottom: 8px; }
  .mealcard.solo { border-style: dashed; }
  .mealh { display: flex; justify-content: space-between; align-items: baseline;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 9px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim);
    padding: 4px 0 2px; }
  .mealcard.solo .mealh { color: var(--faint); }
  .mealg { color: var(--mark); }
  button.pamt { background: none; border: 0; padding: 2px 0 0; text-align: left; cursor: pointer;
    display: block; font-size: 11px; color: var(--faint);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; text-decoration: underline; }
  .portions { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 4px 14px 8px; margin-top: 10px; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .pname { flex: 1; font-size: 13.5px; line-height: 1.25; }
  .pamt { display: block; font-size: 11px; color: var(--faint);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .szrow { display: flex; gap: 8px; }
  .szrow input { flex: 1; }
  .szrow select { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
    color: var(--paper); padding: 12px 14px; font: inherit; font-size: 16px; min-width: 90px; }
  .quick { display: flex; gap: 7px; margin: -6px 0 16px; flex-wrap: wrap; }
  .qb.on { background: var(--mark); border-color: var(--mark); color: #2A2208; }
  .qb { padding: 8px 13px; border-radius: 999px; background: var(--ink-3);
    border: 1px solid var(--line); color: var(--paper-dim); cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; }
  .fq { margin-bottom: 12px; }
  .catrow { margin-bottom: 12px; }
  .cath { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 9px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  select.wide { width: 100%; background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 14px; color: var(--paper); padding: 12px 14px; font: inherit; font-size: 16px; }
  .dblink { display: inline-block; margin-top: 8px; color: var(--mark); font-size: 13px; }
  .btnlink { display: block; width: 100%; margin-top: 8px; padding: 8px 0; background: none;
    border: 0; color: var(--paper-dim); cursor: pointer; text-align: left;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; text-decoration: underline; }
  .btn.danger { border-color: var(--flare); color: var(--flare); background: none; }
  .irow { display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid var(--ink-3); }
  .iname { flex: 1; font-size: 13px; line-height: 1.3; }
  .ifl { display: block; font-size: 10px; color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .ipct { display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--paper-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .ipct input { width: 48px; padding: 7px 6px; border-radius: 9px; text-align: right; font-size: 15px; }
  .ipct input.est { color: var(--mark); border-color: var(--mark); }
  .ig { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    color: var(--paper); min-width: 52px; text-align: right; }
  .fbtns { display: flex; flex-direction: column; gap: 6px; }
  .tag.danger { border-color: var(--flare); color: var(--flare); }
  .row.dim .rowname { color: var(--paper-dim); }
  .cropc { width: 100%; height: auto; display: block; border-radius: 14px;
    border: 1px solid var(--line); margin: 10px 0 4px; touch-action: none; }
  .ocr { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    color: var(--mark); min-height: 16px; margin-top: 10px; line-height: 1.5; }
  .warnb { font-size: 13px; color: var(--paper-dim); line-height: 1.5; margin: 6px 0 4px; }

  .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; gap: 4px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: rgba(18,22,42,.93); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); }
  .nav button { flex: 1; padding: 12px 0; border-radius: 13px; border: 1px solid transparent;
    background: none; color: var(--paper-dim); cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; }
  .nav button.on { background: var(--ink-3); border-color: var(--line); color: var(--paper); }

  h2.sec { font-family: ui-serif, "New York", Georgia, serif; font-size: 21px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--paper-dim); font-size: 13px; margin-bottom: 18px; }

  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(9,11,22,.82); display: flex; align-items: flex-end; }
  .sheet-in { background: var(--ink-2); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-height: 88vh;
    overflow-y: auto; max-width: 560px; margin: 0 auto; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--ink-3); color: var(--paper); font: inherit; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .btn.go { background: var(--paper); color: var(--ink); border-color: var(--paper); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="boot">Opening your log…</div></div>

<script>
(function () {
  var KEY = "skinlog:v2";
  var state = { days: {}, custom: [], foods: [], presets: [], carry: null, routine: { am:"", pm:"", notes:"" }, backedUp: null, reader: "" };
  var view = "today", foodsView = "active", sel = todayStr(), lag = 1, measure = "nw", mode = "presence",
      sheet = null, saveTimer = null, calMonth = null;

  // ---- storage: real filesystem-backed store inside Claude, localStorage on your own host
  var store = {
    get: function () {
      if (window.storage) return window.storage.get(KEY).then(function (r) { return r && r.value; });
      try { return Promise.resolve(localStorage.getItem(KEY)); }
      catch (e) { return Promise.resolve(null); }
    },
    set: function (v) {
      if (window.storage) return window.storage.set(KEY, v);
      try { localStorage.setItem(KEY, v); } catch (e) {}
      return Promise.resolve();
    }
  };

  var TYPES = [
    { k: "co",  name: "Clogged",  hint: "no redness, no pain — skip the nose", col: "#6E6FA8" },
    { k: "inf", name: "Inflamed", hint: "red, near the surface, head or not", col: "#C9707F" },
    { k: "dp",  name: "Deep",     hint: "firm lump underneath, hurts to press", col: "#E4737E" }
  ];
  var MEASURES = [["nw","New today"],["all","All spots"],["co","Clogged"],["inf","Inflamed"],["dp","Deep"]];
  var ZONES = ["Forehead","Temples","Nose","Cheeks","Jaw / chin","Around mouth","Neck","Chest / back"];

  var FLAGS = ["Dairy","Whey / casein","Egg","Soy","Gluten / wheat","Added sugar","High sugar",
    "Artificial sweetener","Cocoa / chocolate","Nuts","Seed oils","Palm oil","Fried / high fat",
    "Caffeine","Alcohol","Iodine-rich","Additives / preservatives","Spicy","Fermented",
    "Red meat","Fish / seafood","Whole grain","Fruit / veg","Highly processed"];

  // offline ingredient matcher — no network, no API key
  // OCR mangles diacritics, so match against a folded ASCII form of the text
  function fold(t) {
    return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  var RULES = [
    ["Dairy", /milk|mjolk|filmjolk|lactose|laktos|whey|vassle|casein|kasein|cream(?!\s*of\s*tartar)|gradde|creme fraiche|butter(?!nut)|\bsmor\b|cheese|\bost\b|\bostar\b|ostpulver|mozzarella|cheddar|parmesan|\bfeta\b|ricotta|halloumi|mascarpone|kvarg|kvark|kesella|yogh?urt|\bghee\b|\bskyr\b|kefir|prastost|herrgard|gouda|brie/],
    ["Whey / casein", /whey|vassle|casein|kasein|mjolkprotein|milk protein/],
    ["Egg", /\begg|\bagg\b|aggula|aggvita|albumen|aggpulver/],
    ["Soy", /\bsoy|\bsoja/],
    ["Gluten / wheat", /wheat|\bvete|durum|gluten|barley|\bkorn\b|\brye\b|\brag\b|ragmjol|semolina|spelt|dinkel|mannagryn/],
    ["Added sugar", /sugar|socker|syrup|sirap|dextros|dextrose|fruktos|fructose|glukos|glucose|maltodextrin|honey|honung|molasses|melass|invertsocker|sucrose|maltose|agavesirap/],
    ["Artificial sweetener", /aspartam|sucralos|sukralos|acesulfam|saccharin|sackarin|stevia|steviol|sorbitol|xylitol|maltitol|erytritol|erythritol|sotningsmedel|sweetener/],
    ["Cocoa / chocolate", /cocoa|cacao|kakao|chocolate|choklad/],
    ["Nuts", /almond|mandel|hazelnut|hasselnot|peanut|jordnot|cashew|walnut|valnot|pistachio|pistage|pecan|pekan|\bnuts\b|\bnotter\b|nougat/],

    var m = Math.floor(b.length / 2);
    return b.length % 2 ? b[m] : (b[m-1] + b[m]) / 2;
  }
  function allTags() {
    var out = [];
    GROUPS.forEach(function (g) { g.tags.forEach(function (t) { if (out.indexOf(t)<0) out.push(t); }); });
    state.custom.forEach(function (t) { if (out.indexOf(t)<0) out.push(t); });
    state.foods.forEach(function (f) { if (out.indexOf(f.n)<0) out.push(f.n);
      (f.fl||[]).forEach(function (fl) { if (out.indexOf(fl)<0) out.push(fl); }); });
    for (var d in state.days) {
      (state.days[d].oneoff || []).forEach(function (f) {
        if (out.indexOf(f.n)<0) out.push(f.n);
        (f.fl||[]).forEach(function (fl) { if (out.indexOf(fl)<0) out.push(fl); });
      });
    }
    return out;
  }

  function daysLogged() { return Object.keys(state.days).length; }
  function daysSinceBackup() {
    if (!state.backedUp) return null;
    return Math.floor((Date.now() - state.backedUp) / 86400000);
  }
  function backupOverdue() {
    if (daysLogged() < 5) return false;
    var d = daysSinceBackup();
    return d === null || d >= 14;
  }
  function markBackedUp() { state.backedUp = Date.now(); save(); render(); }

  function shareBackup() {
    var text = JSON.stringify(state);
    var name = "skinlog-" + todayStr() + ".json";
    if (navigator.canShare) {
      try {
        var file = new File([text], name, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], title: "Skin Log backup" })
            .then(markBackedUp).catch(function () {});
        }
      } catch (e) {}
    }
    if (navigator.share) {
      return navigator.share({ title: "Skin Log backup", text: text })
        .then(markBackedUp).catch(function () {});
    }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    markBackedUp();
  }

  function banner() {
    if (!backupOverdue()) return "";

      + '<div class="warnb">'+daysLogged()+' days of logging live only on this phone. '
      + 'Deleting the app or clearing Safari data would take them with it.</div>'

  function strip() {
    var ws = weekStart(sel);
    var days = [], i;
    for (i = 0; i < 7; i++) days.push(shift(ws, i));

    // scale bars against the busiest day in this week, with a sane floor
    var max = 4;
    days.forEach(function (d) { var t = totalOf(peek(d)); if (t && t > max) max = t; });

    var mA = parseD(days[0]), mB = parseD(days[6]);
    var monthLabel;
    if (mA.getMonth() === mB.getMonth()) {
      monthLabel = mA.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    } else if (mA.getFullYear() === mB.getFullYear()) {
      monthLabel = mA.toLocaleDateString(undefined, { month: "short" }) + " \u2013 "
                 + mB.toLocaleDateString(undefined, { month: "short", year: "numeric" });
    } else {
      monthLabel = mA.toLocaleDateString(undefined, { month: "short", year: "numeric" }) + " \u2013 "
                 + mB.toLocaleDateString(undefined, { month: "short", year: "numeric" });
    }
    var canForward = !isFuture(shift(ws, 7));

    var h = '<div class="strip-shell"><div class="weekhead">'
      + '<span class="wmonth">' + esc(monthLabel) + '</span>'
      + '<button class="wcal" data-calendar="1">All days</button></div>'
      + '<div class="week">'
      + '<button class="warr" data-week="-1" aria-label="Previous week">&lsaquo;</button>'
      + '<div class="wdays">';

    days.forEach(function (d) {
      var e = peek(d), t = totalOf(e), dt = parseD(d);
      var fut = isFuture(d);
      var cls = "day" + (d === sel ? " sel" : "") + (d === todayStr() ? " now" : "") + (fut ? " fut" : "");
      h += '<button class="' + cls + '"' + (fut ? " disabled" : ' data-day="' + d + '"') + '>'
         + '<span class="bar-slot">';
      if (fut || t == null) h += '<span class="seg none"></span>';
      else if (t === 0) h += '<span class="seg zero"></span>';
      else if (e.k) {
        ["dp", "inf", "co"].forEach(function (k) {
          var v = e.k[k] || 0; if (!v) return;
          h += '<span class="seg ' + k + '" style="height:' + Math.max(2, Math.round((v / max) * 46)) + 'px"></span>';
        });
      } else h += '<span class="seg inf" style="height:' + Math.max(2, Math.round((t / max) * 46)) + 'px"></span>';
      h += '</span><span class="dow">'
         + dt.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 1).toUpperCase() + '</span>'
         + '<span class="dnum">' + dt.getDate() + '</span></button>';
    });

    h += '</div><button class="warr' + (canForward ? '' : ' off') + '"'
       + (canForward ? ' data-week="1"' : ' disabled') + ' aria-label="Next week">&rsaquo;</button>'
       + '</div></div>';
    return h;
  }

  var carriedFrom = null, mealTarget = null;

  // a "save for tomorrow" drops itself onto the next day you open, once
  function maybeCarry() {
    carriedFrom = null;
    var c = state.carry;
    if (!c || !c.d) return;
    if (sel < c.d || isFuture(sel)) return;
    if (touched(peek(sel))) return;          // never overwrite a day you already started
    var tgt = entry(sel);
    (c.t || []).forEach(function (x) { if (tgt.t.indexOf(x) < 0) tgt.t.push(x); });
    var carriedOnce = {};
    (c.oneoff || []).forEach(function (f) { carriedOnce[f.n] = true; });
    (c.f || []).forEach(function (x) {
      if (!carriedOnce[x] && !foodByName(x)) return;   // library food deleted in the meantime
      if (tgt.f.indexOf(x) < 0) tgt.f.push(x);
      if (tgt.fa[x] == null) tgt.fa[x] = (c.fa && c.fa[x]) || 1;
    });
    if (c.m) { tgt.m = tgt.m || {}; for (var cm in c.m) if (tgt.m[cm] == null) tgt.m[cm] = c.m[cm]; }
    (c.oneoff || []).forEach(function (f) {
      if (tgt.f.indexOf(f.n) < 0) return;
      var dup = false;
      (tgt.oneoff = tgt.oneoff || []).forEach(function (x) { if (x.n === f.n) dup = true; });
      if (!dup) tgt.oneoff.push(JSON.parse(JSON.stringify(f)));
    });
    carriedFrom = c.from || null;
    state.carry = null;
    saveNow();   // consuming a carry must stick even if the app is closed immediately
  }

    h += '</div></div>';

           + esc(f.n)+'</button>';

    if (e) h += '<button class="btn danger" data-resetday="1">Reset this day</button><div style="height:8px"></div>';

  var foodQuery = "";

  var draft = { name:"", flags:[], ingredients:[], items:[], raw:"", rawFull:"", sz:null, u:"g", barcode:"", labelPhoto:"", dbState:"", editing:null };

        + '<b>deeper than the redness looks</b>, and it hurts to press. May be red, may be skin-coloured. '
        + 'Often never forms a head. Lasts a week or more.</div></div>'
        + '<div class="grp"><div class="grph">New today</div><div class="note">How many turned up '
        + '<b>since yesterday</b>, any kind. The three counts above are standing totals, so one spot is '
        + 'counted every day it hangs around — good for severity, bad for cause. New arrivals point at '
        + 'something that happened a day or two ago.</div></div>'
        + '<div class="grp"><div class="grph">Skin feel</div><div class="note">Not about spots — about '
        + '<b>irritation</b>. <b>Fine</b>: no complaints. <b>Tight</b>: dry, flaky, stretched after '
        + 'cleansing. <b>Stinging</b>: burns on application, or blotchy redness across whole areas. '
        + '<b>Raw</b>: sore to touch, peeling, you\'d skip the retinal tonight.</div></div>'
        + '<button class="btn go" data-close="1">Got it</button>';
    } else if (stage === "crop") {
      h += '<h2 class="sec">Frame the ingredients</h2>'
        + '<div class="sub">Drag a box around <b>just the ingredient list</b>. Leave out cooking '
        + 'instructions and the nutrition table — they confuse the reader and add nothing.</div>'
        + '<canvas id="cropc" class="cropc"></canvas>'
        + '<div id="ocr" class="ocr"></div>'
        + '<button class="btn go" data-docrop="1">Read this bit</button>'
        + '<button class="btn" data-cropall="1">Read the whole photo</button>'
        + '<button class="btn" data-close="1">Cancel</button>';
    } else if (stage === "calendar") {
      var mk = calMonth || monthKey(sel);
      var yy = parseInt(mk.split("-")[0], 10), mm = parseInt(mk.split("-")[1], 10);
      var first = yy + "-" + pad(mm) + "-01";
      var dim = new Date(yy, mm, 0).getDate();
      var lead = (parseD(first).getDay() + 6) % 7;
      var label = parseD(first).toLocaleDateString(undefined, { month: "long", year: "numeric" });
      var prevM = mm === 1 ? (yy-1) + "-12" : yy + "-" + pad(mm-1);
      var nextM = mm === 12 ? (yy+1) + "-01" : yy + "-" + pad(mm+1);
      var canNext = nextM <= monthKey(todayStr());
      var earliest = monthKey(firstLogged());
      var canPrev = prevM >= (earliest < monthKey(todayStr()) ? earliest : prevM);

      // busiest day this month sets the colour scale
      var peak = 1;
      for (var dd = 1; dd <= dim; dd++) {
        var tt = totalOf(peek(yy + "-" + pad(mm) + "-" + pad(dd)));
        if (tt && tt > peak) peak = tt;
      }

      h += '<h2 class="sec">All days</h2>'
        + '<div class="sub">Every day you have logged. Tap one to open it.</div>'
        + '<div class="calhead">'
        + '<button class="warr" data-month="' + prevM + '">&lsaquo;</button>'
        + '<span class="calm">' + esc(label) + '</span>'
        + '<button class="warr' + (canNext ? '' : ' off') + '"'
        + (canNext ? ' data-month="' + nextM + '"' : ' disabled') + '>&rsaquo;</button>'
        + '</div><div class="calgrid">';

      ["M","T","W","T","F","S","S"].forEach(function (w) { h += '<div class="calw">' + w + '</div>'; });
      for (var b = 0; b < lead; b++) h += '<div></div>';
      for (var day = 1; day <= dim; day++) {
        var ds = yy + "-" + pad(mm) + "-" + pad(day);
        var e2 = peek(ds), t2 = totalOf(e2), fu = isFuture(ds);
        var cls2 = "calc";
        if (ds === sel) cls2 += " sel";
        if (ds === todayStr()) cls2 += " now";
        if (fu) cls2 += " fut";
        var style = "";
        if (!fu && t2 != null) {
          if (t2 === 0) style = 'background:rgba(79,191,168,.28);border-color:var(--calm)';
          else style = 'background:rgba(228,115,126,' + (0.16 + 0.62 * Math.min(1, t2 / peak)).toFixed(2) + ');border-color:var(--flare)';
        }
        h += '<button class="' + cls2 + '"' + (fu ? " disabled" : ' data-pick="' + ds + '"')
           + (style ? ' style="' + style + '"' : '') + '>' + day
           + (!fu && t2 != null ? '<span class="calt">' + t2 + '</span>' : '') + '</button>';
      }
      h += '</div>'
        + '<div class="rowmeta" style="margin-top:12px">Green means a clear day. Deeper red means more '
        + 'spots. Blank means nothing logged.</div>'
        + '<button class="btn" data-close="1">Close</button>';
    } else if (stage === "tags") {
      h += '<h2 class="sec">Your own tags</h2>'
        + '<div class="sub">The ones you added yourself. Renaming keeps your history intact; '
        + 'deleting removes the tag from every day it was logged on.</div>';
      if (!state.custom.length) {
        h += '<div class="note">None yet. Add one from the Today screen with <b>+ Add your own</b>.</div>';
      }
      state.custom.forEach(function (tg, i) {
        var used = 0;
        for (var dd in state.days) { var de = state.days[dd]; if (de.t && de.t.indexOf(tg) >= 0) used++; }
        h += '<div class="row"><div><div class="rowname">'+esc(tg)+'</div>'
          + '<div class="rowmeta">'+(used ? "logged on "+used+" day"+(used===1?"":"s") : "never logged")+'</div></div>'
          + '<div class="fbtns"><button class="tag" data-rentag="'+i+'">Rename</button>'
          + '<button class="tag" data-deltag="'+i+'">Delete</button></div></div>';
      });
      h += '<button class="btn" data-close="1">Close</button>';
    } else if (stage === "meal") {
      var me = state.days[sel] || { f: [], m: {} }, nm4 = mealTarget;
      var gs = mealGroups(me);
      h += '<h2 class="sec">Eaten with what?</h2>'
        + '<div class="sub">' + esc(nm4) + ' — group it with whatever you had at the same sitting.</div>';
      gs.forEach(function (g, gi) {
        var others = g.foods.filter(function (x) { return x !== nm4; });
        if (!others.length) return;
        var mine = g.foods.indexOf(nm4) >= 0;
        h += '<button class="btn' + (mine ? " go" : "") + '" data-setmeal="'
           + (g.solo ? "with:" + esc(others[0]) : g.id.slice(1)) + '">'
           + (mine ? "\u2713 " : "") + (g.solo ? "With " + esc(others[0]) : "Meal " + (gi + 1) + " \u2014 " + esc(others.join(", ")))
           + '</button>';
      });
      var alone = !me.m || me.m[nm4] == null;
      h += '<button class="btn' + (alone ? " go" : "") + '" data-setmeal="alone">'
        + (alone ? "\u2713 " : "") + 'On its own</button>'
        + '<button class="btn" data-close="1">Cancel</button>';
    } else if (stage === "presets") {
      h += '<h2 class="sec">Presets</h2>'
        + '<div class="sub">A saved set of foods and tags you can drop onto any day. Good for the meals '
        + 'and habits that repeat — your usual weekday, a training day, a takeaway night.</div>';
      if (!state.presets.length) {
        h += '<div class="note">None saved. Set up a day the way you normally eat, then save it here.</div>';
      }
      state.presets.forEach(function (ps, i) {
        h += '<div class="row"><div><div class="rowname">'+esc(ps.n)+'</div><div class="rowmeta">'
          + (ps.f||[]).length+' foods · '+(ps.t||[]).length+' tags</div></div>'
          + '<div class="fbtns"><button class="tag" data-applypreset="'+i+'">Apply</button>'
          + '<button class="tag" data-delpreset="'+i+'">Delete</button></div></div>';
      });
      h += '<button class="btn go" data-savepreset="1">Save this day as a preset</button>'
        + '<button class="btn" data-close="1">Close</button>';
    } else if (stage === "routine") {
      var r = state.routine || {};
      h += '<h2 class="sec">Standing routine</h2>'
        + '<div class="sub">What you do most days. One step per line. This stays on your phone — '
        + 'it is not part of the app\'s code.</div>'
        + '<div class="grph">Morning</div>'
        + '<textarea id="ram" placeholder="Cleanser&#10;Moisturiser&#10;SPF">'+esc(r.am||"")+'</textarea>'
        + '<div class="grph" style="margin-top:16px">Night</div>'
        + '<textarea id="rpm" placeholder="Cleanser&#10;Active&#10;Moisturiser">'+esc(r.pm||"")+'</textarea>'
        + '<div class="grph" style="margin-top:16px">Notes</div>'
        + '<textarea id="rno" placeholder="Anything that interrupts it — treatments, breaks">'+esc(r.notes||"")+'</textarea>'
        + '<button class="btn go" data-saveroutine="1">Save</button>'
        + '<button class="btn" data-close="1">Cancel</button>';
    } else {
      h += '<h2 class="sec">'+(data.editing?"Edit food":"Add a food")+'</h2>'
        + '<input type="text" id="fname" value="'+esc(data.name||"")+'" placeholder="Name it — e.g. protein bar">'

        + '<div class="grp" style="margin-top:18px"><div class="grph">Barcode</div>'
        + '<div class="szrow">'
        + '<input type="text" inputmode="numeric" id="fbc" value="'+esc(data.barcode||"")+'" placeholder="13 digits from the pack">'
        + '<button class="btn" style="margin:0;width:auto;padding:12px 16px" data-lookup="1">Look up</button>'
        + '</div>'
        + (hasBarcodeScanner()
             ? '<input type="file" accept="image/*" capture="environment" id="bcshot" style="display:none">'
               + '<button class="btn" data-bcscan="1">Scan the barcode</button>'
             : '')
        + '<div class="rowmeta" style="margin-top:6px">The accurate route — pulls the real ingredient '
        + 'list, percentages and pack weight from the open product database.</div></div>'

        + '<div id="ocr" class="ocr"></div>'

        + (data.fromDB ? dbNote(data) : '')

        + '<div class="grp"><div class="grph">Category</div>'
        + '<select id="fcat" class="wide">'
        + CATS.map(function (c) {
            var cur = data.catTouched && data.cat ? data.cat : guessCat(data.flags, data.u);
            return '<option value="'+esc(c)+'"'+(cur===c?" selected":"")+'>'+esc(c)+'</option>';
          }).join("")
        + '</select></div>'

        + '<div class="grph">One portion</div>'
        + '<div class="szrow">'
        + '<input type="text" inputmode="decimal" id="fsz" value="'+(data.sz==null?"":data.sz)+'" placeholder="e.g. 400">'
        + '<select id="fu">'
        + UNITS.map(function(u){ return '<option value="'+u[0]+'"'+((data.u||"g")===u[0]?" selected":"")+'>'+u[1]+'</option>'; }).join("")
        + '</select></div>'
        + '<div class="rowmeta" style="margin:6px 0 18px">What you normally eat at once.</div>'

        + '<div class="grp"><div class="grph">Ingredients</div>'
        + '<div class="rowmeta" style="margin-bottom:6px">Not in the database? Long-press the box and '
        + 'choose <b>Scan Text</b> to read the packet with your camera.</div>'
        + '<textarea id="fing" placeholder="Ingredients…">'+esc(data.raw||"")+'</textarea>'
        + '<button class="btn" data-parse="1">Read the ingredients</button>'
        + '<input type="file" accept="image/*" capture="environment" id="cam" style="display:none">'
        + '<input type="file" accept="image/*" id="lib" style="display:none">'
        + '<div class="szrow" style="margin-top:8px">'
        + '<button class="btn" style="margin:0" data-cam="1">Scan the label</button>'
        + '<button class="btn" style="margin:0" data-lib="1">Choose a photo</button></div>'
        + '<div class="rowmeta" style="margin-top:6px">Crop to just the ingredient list when it asks. '
        + 'Works offline after the first use.</div></div>' 

        + breakdownHTML(data)
        + '<div class="grp" style="margin-top:18px"><div class="grph">Groups</div><div class="tags">';
      FLAGS.forEach(function (fl) {
        h += '<button class="tag'+((data.flags||[]).indexOf(fl)>=0?" on":"")+'" data-flag="'+esc(fl)+'">'+esc(fl)+'</button>';
      });
      h += '</div></div>'
        + (data.editing || data.editingOnce ? ''
            : '<div class="grp"><div class="grph">Keep it?</div>'
              + '<div class="sev">'
              + '<button class="sevb'+(data.once?"":" on")+'" data-once="0">Save to my foods</button>'
              + '<button class="sevb'+(data.once?" on":"")+'" data-once="1">Just today</button>'
              + '</div>'
              + '<div class="rowmeta" style="margin-top:6px">'
              + (data.once
                   ? 'Stays on this day only — it will not clutter your food list. Still counts fully in Patterns.'
                   : 'Becomes a reusable chip you can tap on any day.')
              + '</div></div>')
        + '<button class="btn go" data-savefood="1">'+(data.once&&!data.editing?"Add to today":"Save it")+'</button>'
        + '<button class="btn" data-close="1">Cancel</button>';
    }
    return h+'</div></div>';
  }

  function breakdownHTML(data) {
    var items = data.items || [];
    if (!items.length) return "";
    var anyEst = items.some(function (it) { return it.est; });
    var h = '<div class="grp" style="margin-top:18px"><div class="grph">Breakdown</div>';
    items.forEach(function (it, i) {
      var g = itemGrams(it);
      h += '<div class="irow"><span class="iname">'+esc(it.n)
         + ((it.fl||[]).length ? '<span class="ifl">'+(it.fl||[]).map(esc).join(" · ")+'</span>' : '<span class="ifl" style="color:var(--faint)">no group</span>')
         + '</span>'
         + '<span class="ipct"><input type="text" inputmode="decimal" id="ip'+i+'" value="'+(it.p==null?"":it.p)+'"'
         + (it.est?' class="est"':'')+'>%</span>'
         + '<span class="ig">'+(g==null?"":g+(data.u==="ml"?"ml":"g"))+'</span></div>';
    });
    if (anyEst) h += '<div class="rowmeta" style="margin-top:8px">Percentages in gold are '
      + '<b>estimated</b> from list order — labels run heaviest first. Correct any that matter; '
      + 'the ones printed on the pack were read directly.</div>';
    h += '<button class="btn" data-recount="1">Re-read from the text above</button></div>';
    return h;
  }

  function dbNote(data) {
    var serving = (data.serving && data.sz && data.serving !== data.sz)
      ? ' Pack is ' + data.sz + data.u + '; one stated serving is ' + data.serving + data.u + '.' : '';
    if (data.dbState === "full") {
      return '<div class="note" style="border-color:var(--calm);margin:0 0 14px">'
        + 'Found, with a full ingredient breakdown.' + serving + '</div>';
    }
    if (data.dbState === "partial") {
      return '<div class="note" style="border-color:var(--mark);margin:0 0 14px">'
        + '<b>Found, but nobody has typed in the ingredient list.</b> The groups below come from its '
        + 'allergen and additive tags only, so amounts will be missing. '
        + (data.labelPhoto ? 'There is a photo of the label — open it, then copy the text in.'
                           : 'Add the ingredients by hand below.')
        + (data.labelPhoto ? '<br><a class="dblink" href="' + esc(data.labelPhoto)
             + '" target="_blank" rel="noopener">Open the label photo</a>' : '')
        + serving + '</div>';
    }
    return '<div class="note" style="border-color:var(--flare);margin:0 0 14px">'
      + '<b>Found the product, but it has no ingredient data at all.</b> Open Food Facts is '
      + 'crowd-sourced and many entries are just a name and a barcode. '
      + (data.labelPhoto ? 'Someone did photograph the label though.'
                         : 'Type the ingredients in below, or use Scan Text on the packet.')
      + (data.labelPhoto ? '<br><a class="dblink" href="' + esc(data.labelPhoto)
           + '" target="_blank" rel="noopener">Open the label photo</a>' : '')
      + serving + '</div>';
  }

  function hasBarcodeScanner() { return typeof BarcodeDetector !== "undefined"; }

  function scanBarcode() {
    var inp = document.getElementById("bcshot");
    if (!inp) return;
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      grabDraft();
      ocrStatus("Reading the barcode\u2026");
      prepImage(f, function (canvas) {
        if (!canvas) return ocrStatus("That image didn't load.");
        try {
          var det = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128"] });
          det.detect(canvas).then(function (codes) {
            if (!codes || !codes.length) return ocrStatus("No barcode found. Fill the frame with it, or type the digits.");
            lookupBarcode(codes[0].rawValue);
          }).catch(function () { ocrStatus("Couldn't read that barcode. Type the digits instead."); });
        } catch (e) { ocrStatus("Couldn't read that barcode. Type the digits instead."); }
      });
    };
    inp.click();
  }

  function grabDraft() {
    var n = document.getElementById("fname"), g = document.getElementById("fing"),
        z = document.getElementById("fsz"), u = document.getElementById("fu");
    if (n) draft.name = n.value;
    if (g) draft.raw = g.value;
    if (z) draft.sz = z.value ? parseFloat(String(z.value).replace(",", ".")) : null;
    if (u) draft.u = u.value;
    var bc = document.getElementById("fbc");
    if (bc) draft.barcode = bc.value.replace(/\D/g, "");
    (draft.items || []).forEach(function (it, i) {
      var el = document.getElementById("ip" + i);
      if (!el) return;
      var v = parseFloat(String(el.value).replace(",", "."));
      if (!isNaN(v) && v >= 0 && v <= 100) { it.p = v; it.est = false; }
    });
  }

  function rebuildDraft() {
    draft.items = parseItemList(draft.raw);
    draft.ingredients = draft.items.map(function (it) { return it.n; });
    var fl = [];
    draft.items.forEach(function (it) {
      (it.fl || []).forEach(function (f) { if (fl.indexOf(f) < 0) fl.push(f); });
    });
    var extra = parseIngredients(draft.raw).flags;
    extra.forEach(function (f) { if (fl.indexOf(f) < 0) fl.push(f); });
    draft.flags = fl;
  }

  function itemGrams(it) {
    if (!draft.sz || draft.u === "piece") return null;
    return Math.round(draft.sz * (it.p || 0) / 100 * 10) / 10;
  }

  // ---------- reading a label ----------
  function ocrStatus(msg) {
    var el = document.getElementById("ocr");
    if (el) el.textContent = msg || "";
  }

  function pickImage(useCamera) {
    var inp = document.getElementById(useCamera ? "cam" : "lib");
    if (!inp) return;
    inp.onchange = function () {
      var file = inp.files && inp.files[0];
      if (!file) return;
      grabDraft();
      ocrStatus("Loading photo…");
      prepImage(file, function (canvas) {
        if (!canvas) return ocrStatus("That image didn't load. Try again.");
        shot = canvas;
        cropBox = null;
        openSheet("crop", draft);
      });
    };
    inp.click();
  }

  // keep resolution — OCR needs roughly 25px of character height to work at all
  function prepImage(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 3000, w = img.width, h = img.height;
        if (Math.max(w, h) > max) { var k = max / Math.max(w, h); w = Math.round(w*k); h = Math.round(h*k); }
        var c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(c);
      };
      img.onerror = function () { cb(null); };
      img.src = r.result;
    };
    r.onerror = function () { cb(null); };
    r.readAsDataURL(file);
  }

  // crop, upscale, then adaptive local threshold — this is what makes small print legible
  function sharpen(src, box) {
    var sx = Math.round(box.x), sy = Math.round(box.y),
        sw = Math.max(8, Math.round(box.w)), sh = Math.max(8, Math.round(box.h));
    var scale = Math.min(3, Math.max(1, 1700 / sw));
    var w = Math.round(sw * scale), h = Math.round(sh * scale);
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    if (ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);

    try {
      var d = ctx.getImageData(0, 0, w, h), p = d.data, n = w * h;
      var gray = new Float64Array(n), i, j;
      for (i = 0, j = 0; j < n; i += 4, j++) gray[j] = p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114;

      // integral image for O(1) window means
      var iw = w + 1, integ = new Float64Array(iw * (h + 1));
      for (var y = 0; y < h; y++) {
        var rs = 0;
        for (var x = 0; x < w; x++) {
          rs += gray[y*w + x];
          integ[(y+1)*iw + (x+1)] = integ[y*iw + (x+1)] + rs;
        }
      }
      var rad = Math.max(8, Math.round(Math.min(w, h) / 45)), C = 10;
      for (var yy = 0; yy < h; yy++) {
        var y1 = yy - rad < 0 ? 0 : yy - rad, y2 = yy + rad > h-1 ? h-1 : yy + rad;
        for (var xx = 0; xx < w; xx++) {
          var x1 = xx - rad < 0 ? 0 : xx - rad, x2 = xx + rad > w-1 ? w-1 : xx + rad;
          var area = (x2-x1+1) * (y2-y1+1);
          var sum = integ[(y2+1)*iw + (x2+1)] - integ[y1*iw + (x2+1)]
                  - integ[(y2+1)*iw + x1] + integ[y1*iw + x1];
          var v = gray[yy*w + xx] < (sum/area) - C ? 0 : 255;
          var k = (yy*w + xx) * 4;
          p[k] = p[k+1] = p[k+2] = v; p[k+3] = 255;
        }
      }
      ctx.putImageData(d, 0, 0);
    } catch (e) {}
    return c;
  }

  // Drag a food by its grip onto another meal card. Pointer events cover touch and mouse;
  // touch-action is disabled on the grip only, so the rest of the page still scrolls.
  function setupDrag() {
    var grips = document.querySelectorAll("[data-grip]");
    if (!grips.length) return;

    for (var i = 0; i < grips.length; i++) bindGrip(grips[i]);

    function bindGrip(grip) {
      grip.addEventListener("pointerdown", function (ev) {
        if (ev.button != null && ev.button !== 0) return;
        ev.preventDefault();
        ev.stopPropagation();

        var name = grip.getAttribute("data-grip");
        var row = grip.closest(".prow");
        var startX = ev.clientX, startY = ev.clientY;
        var moved = false, ghost = null, lastTarget = null;

        try { grip.setPointerCapture(ev.pointerId); } catch (e) {}

        function makeGhost() {
          var r = row.getBoundingClientRect();
          ghost = document.createElement("div");
          ghost.className = "dragghost";
          ghost.textContent = name;
          ghost.style.width = r.width + "px";
          document.body.appendChild(ghost);
          row.classList.add("dragging");
        }

        function place(x, y) {
          if (!ghost) return;
          ghost.style.left = (x - 40) + "px";
          ghost.style.top = (y - 22) + "px";
        }

        function targetAt(x, y) {
          if (ghost) ghost.style.display = "none";
          var el = document.elementFromPoint(x, y);
          if (ghost) ghost.style.display = "";
          if (!el) return null;
          var card = el.closest ? el.closest("[data-drop]") : null;
          return card;
        }

        function onMove(e2) {
          var dx = e2.clientX - startX, dy = e2.clientY - startY;
          if (!moved && Math.sqrt(dx*dx + dy*dy) < 6) return;
          if (!moved) { moved = true; makeGhost(); }
          e2.preventDefault();
          place(e2.clientX, e2.clientY);

          var card = targetAt(e2.clientX, e2.clientY);
          if (card !== lastTarget) {
            if (lastTarget) lastTarget.classList.remove("dropon");
            lastTarget = card;
            if (card && card.getAttribute("data-drop") !== ownGroupId(name)) card.classList.add("dropon");
          }

          // nudge the page when dragging near an edge
          if (window.scrollBy) {
            var vh = window.innerHeight;
            if (e2.clientY < 90) window.scrollBy(0, -12);
            else if (e2.clientY > vh - 110) window.scrollBy(0, 12);
          }
        }

        function cleanup() {
          if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
          if (lastTarget) lastTarget.classList.remove("dropon");
          row.classList.remove("dragging");
          grip.removeEventListener("pointermove", onMove);
          grip.removeEventListener("pointerup", onUp);
          grip.removeEventListener("pointercancel", onCancel);
        }

        function onUp(e3) {
          var card = moved ? targetAt(e3.clientX, e3.clientY) : null;
          cleanup();
          if (!moved) return;                       // a tap, not a drag
          if (!card) return;
          var dropId = card.getAttribute("data-drop");
          if (dropId === ownGroupId(name)) return;  // dropped back where it started
          dropInto(name, dropId);
        }
        function onCancel() { cleanup(); }

        grip.addEventListener("pointermove", onMove);
        grip.addEventListener("pointerup", onUp);
        grip.addEventListener("pointercancel", onCancel);
      });
    }
  }

  function ownGroupId(name) {
    var e = state.days[sel];
    if (!e) return null;
    return (e.m && e.m[name] != null) ? "g" + e.m[name] : "solo:" + name;
  }

  function dropInto(name, dropId) {
    var e = entry(sel);
    if (dropId === "new") { setMeal(e, name, null); }
    else if (dropId.indexOf("solo:") === 0) {
      var partner = dropId.slice(5);
      if (partner === name) return;
      var nid = nextMealId(e);
      if (!e.m) e.m = {};
      e.m[partner] = nid; e.m[name] = nid;
    } else {
      setMeal(e, name, +dropId.slice(1));
    }
    save(); render();
  }

  function setupCrop() {
    var c = document.getElementById("cropc");
    if (!c || !shot) return;
    var maxW = Math.min(c.parentNode.clientWidth || 340, 520);
    var scale = maxW / shot.width;
    c.width = Math.round(shot.width * scale);
    c.height = Math.round(shot.height * scale);
    cropView = { scale: scale };
    drawCrop();

    var dragging = false, start = null;
    function pos(ev) {
      var r = c.getBoundingClientRect();
      var t = ev.touches ? ev.touches[0] : ev;
      return { x: (t.clientX - r.left) * (c.width / r.width),
               y: (t.clientY - r.top) * (c.height / r.height) };
    }
    function down(ev) { ev.preventDefault(); dragging = true; start = pos(ev); cropBox = null; drawCrop(); }
    function move(ev) {
      if (!dragging) return;
      ev.preventDefault();
      var p = pos(ev);
      cropBox = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y),
                  w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
      drawCrop();
    }
    function up() { dragging = false; }
    c.addEventListener("touchstart", down, { passive: false });
    c.addEventListener("touchmove", move, { passive: false });
    c.addEventListener("touchend", up);
    c.addEventListener("mousedown", down);
    c.addEventListener("mousemove", move);
    c.addEventListener("mouseup", up);
  }

  function drawCrop() {
    var c = document.getElementById("cropc");
    if (!c || !shot) return;
    var ctx = c.getContext("2d");
    ctx.drawImage(shot, 0, 0, c.width, c.height);
    if (cropBox && cropBox.w > 6 && cropBox.h > 6) {
      ctx.fillStyle = "rgba(9,11,22,.66)";
      ctx.fillRect(0, 0, c.width, cropBox.y);
      ctx.fillRect(0, cropBox.y + cropBox.h, c.width, c.height - cropBox.y - cropBox.h);
      ctx.fillRect(0, cropBox.y, cropBox.x, cropBox.h);
      ctx.fillRect(cropBox.x + cropBox.w, cropBox.y, c.width - cropBox.x - cropBox.w, cropBox.h);
      ctx.strokeStyle = "#E8B84B"; ctx.lineWidth = 2;
      ctx.strokeRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);
    } else {
      ctx.fillStyle = "rgba(9,11,22,.28)";
      ctx.fillRect(0, 0, c.width, c.height);
    }
  }

  function runCrop(whole) {
    if (!shot) return;
    var box;
    if (whole || !cropBox || cropBox.w < 10 || cropBox.h < 10) {
      box = { x: 0, y: 0, w: shot.width, h: shot.height };
    } else {
      var k = 1 / cropView.scale;
      box = { x: cropBox.x * k, y: cropBox.y * k, w: cropBox.w * k, h: cropBox.h * k };
    }
    var sharp = sharpen(shot, box);
    if (state.reader) readViaAI(sharp.toDataURL("image/jpeg", 0.9));
    else readViaOCR(sharp);
  }

  var tessLoading = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (tessLoading) return tessLoading;
    tessLoading = new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = res;
      s.onerror = function () { tessLoading = null; rej(new Error("load")); };
      document.head.appendChild(s);
    });
    return tessLoading;
  }

  function readViaOCR(canvas) {
    ocrStatus("Loading the reader… first time needs a connection.");
    loadTesseract().then(function () {
      ocrStatus("Reading…");
      return Tesseract.createWorker(["eng", "swe"], 1, {
        logger: function (m) {
          if (m.status === "recognizing text") ocrStatus("Reading… " + Math.round(m.progress * 100) + "%");
          else if (/loading|initializ/i.test(m.status)) ocrStatus("Loading the reader…");
        }
      });
    }).then(function (worker) {
      return worker.setParameters({
        tessedit_pageseg_mode: "6",
        preserve_interword_spaces: "1"
      }).then(function () {
        return worker.recognize(canvas).then(function (res) {
          return worker.terminate().then(function () { return res.data.text; });
        });
      });
    }).then(function (text) {
      applyScan(text);
    }).catch(function () {
      ocrStatus("Couldn't read that. Try a closer, flatter shot — or type the ingredients in below.");
    });
  }

  function readViaAI(dataUrl) {
    ocrStatus("Reading…");
    fetch(state.reader, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: dataUrl.split(",")[1], flags: FLAGS })
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) return ocrStatus(out.error);
      if (out.name && !draft.name) draft.name = out.name;
      draft.raw = (out.ingredients || []).join(", ");
      draft.ingredients = out.ingredients || [];
      draft.flags = (out.flags || []).filter(function (f) { return FLAGS.indexOf(f) >= 0; });
      openSheet("food", draft);
    }).catch(function () {
      ocrStatus("Couldn't reach your reader. Check the URL in Log → Settings.");
    });
  }

  var ING_HEAD = /ingredien(?:ser|s|ts|ti)?|ingrediens|zutaten|sammans[aä]ttning/i;
  var SECTION_END = /n[aä]ringsv[aä]rde|nutrition|per\s*100\s*g|tillagning|tillagas|cooking|preparation|microwave|mikro|ugn|oven|f[oö]rvar|storage|b[aä]st f[oö]re|best before|nettovikt|net weight|tillverkad|produced|distribu|återvinn|recycl|kundtj[aä]nst|customer/i;

  // keep the ingredient paragraph, drop instructions and the nutrition table
  function ingredientSection(text) {
    var lines = String(text || "").split(/\n+/);
    var start = -1, i;
    for (i = 0; i < lines.length; i++) { if (ING_HEAD.test(lines[i])) { start = i; break; } }
    if (start < 0) return null;
    var out = [lines[start].replace(new RegExp("^.*?" + "ingredien\\w*\\s*[:.-]?", "i"), "")];
    for (i = start + 1; i < lines.length; i++) {
      if (SECTION_END.test(lines[i])) break;
      out.push(lines[i]);
    }
    var joined = out.join(" ").trim();
    return joined.length > 12 ? joined : null;
  }

  // strip lines that are mostly symbols — OCR noise from barcodes, logos, tables
  function denoise(text) {
    return String(text || "").split(/\n+/).filter(function (ln) {
      var t = ln.trim();
      if (t.length < 3) return false;
      var letters = (t.match(/[A-Za-zÅÄÖåäöÉéÜü]/g) || []).length;
      return letters / t.length > 0.5;
    }).join("\n");
  }

  function applyScan(text) {
    var cleaned = denoise(String(text || "").replace(/[|]/g, "I"));
    var full = cleaned.replace(/\s*\n\s*/g, " ").replace(/\s{2,}/g, " ").trim();
    if (!full || full.length < 8) {
      return ocrStatus("Nothing readable there. Get closer, fill the frame with just the ingredients, and keep the packet flat.");
    }
    var section = ingredientSection(cleaned);
    draft.rawFull = full;
    draft.raw = (section || full).replace(/\s{2,}/g, " ").trim();
    draft.foundSection = !!section;
    rebuildDraft();
    var sz = findSize(full);
    if (sz && !draft.sz) { draft.sz = sz.sz; draft.u = sz.u; }
    shot = null; cropBox = null;
    openSheet("food", draft);
  }

  function laserPanel() {
    var sessions = Object.keys(state.days).filter(function (d) {
      var e = state.days[d]; return e && e.t && e.t.indexOf(LASER) >= 0; }).sort();
    if (!sessions.length) return "";
    var buckets = []; for (var i=0;i<=14;i++) buckets.push([]);
    Object.keys(state.days).forEach(function (d) {
      var v = metric(state.days[d], measure); if (v == null) return;
      var best = null;
      sessions.forEach(function (s) { var g = diffDays(s,d); if (g>=0 && g<=14 && (best===null||g<best)) best = g; });
      if (best !== null) buckets[best].push(v);
    });
    var avgs = buckets.map(function (b) { return b.length ? mean(b) : null; });
    var max = Math.max.apply(null, avgs.map(function (a) { return a==null?0:a; }));
    if (!max) return "";
    var h = '<div class="grp"><div class="grph">After a laser session</div>'
      + '<div class="rowmeta" style="margin-bottom:4px">'+sessions.length+' session'
      + (sessions.length===1?"":"s")+' · average by days since</div><div class="lwrap">';
    avgs.forEach(function (a, i) {
      h += '<div class="lcol"><div class="lbar'+(a!=null&&a>=max*0.85?" hot":"")+'" style="height:'
         + (a==null?2:Math.max(2,Math.round((a/max)*76)))+'px"></div><div class="lday">'+i+'</div></div>';
    });
    return h + '</div><div class="rowmeta">Day 0 is the session. A bump in the first week is usually '
      + 'the laser and the retinal break, not your diet.</div></div>';
  }

  function analyse(l, m) {
    var out = [], days = Object.keys(state.days), cache = {};
    days.forEach(function (d) { cache[d] = effective(state.days[d]); });

    allTags().forEach(function (t) {
      var byAmount = (mode === "amount" || mode === "peak") && doseable(t);
      var peaked = (mode === "peak");
      var pairs = [];
      days.forEach(function (d) {
        var v = metric(state.days[d], m); if (v == null) return;
        var sd = shift(d, -l), src = state.days[sd];
        if (!touched(src)) return;
        pairs.push({ v: v, on: (cache[sd]||[]).indexOf(t) >= 0,
                     g: byAmount ? (peaked ? peakDose(src, t) : dose(src, t)) : 0 });
      });
      if (pairs.length < 6) return;

      var A = [], B = [], cut = null;
      if (byAmount) {
        cut = median(pairs.map(function (p) { return p.g; }));
        // a median of zero means most days have none — fall back to any-vs-none
        if (cut <= 0) cut = 0;
        pairs.forEach(function (p) { (p.g > cut ? A : B).push(p.v); });
      } else {
        pairs.forEach(function (p) { (p.on ? A : B).push(p.v); });
      }
      if (A.length < 3 || B.length < 3) return;
      var a = mean(A), b = mean(B);
      out.push({ tag:t, a:a, b:b, delta:a-b, na:A.length, nb:B.length,
                 byAmount: byAmount, peaked: peaked, cut: cut,
                 hiAvg: byAmount ? Math.round(mean(pairs.filter(function(p){return p.g>cut;}).map(function(p){return p.g;}))) : null });
    });
    out.sort(function (x,y) { return Math.abs(y.delta) - Math.abs(x.delta); });
    return out;
  }
